<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IDBots 移动端邀请体系 · 交互原型稿 (A/B 双版本)</title>
  <style>
    :root {
      --wb-bg: #0c0d10;
      --wb-bar: #15171c;
      --wb-border: rgba(255, 255, 255, 0.1);
      --wb-text: #f3f4f6;
      --wb-muted: #9ca3af;
      --wb-gold: #ffdc51;
      --wb-gold-ink: #231f09;

      /* Twin UI Light */
      --t-canvas: #f2f3f5;
      --t-surface: #ffffff;
      --t-raised: #ffffff;
      --t-inset: #e9eaee;
      --t-text: #242425;
      --t-sub: #626267;
      --t-muted: #76767c;
      --t-border: rgba(20, 20, 25, 0.09);
      --t-border-strong: #d7d9de;
      --t-accent: #ffdc51;
      --t-accent-fg: #6b5200;
      --t-accent-ink: #242425;
      --t-success: #167149;
      --t-success-bg: #eaf8f0;
      --t-warn: #825600;
      --t-warn-bg: #fff7db;
      --t-danger: #b42318;
      --t-danger-bg: #fff1f0;
      --t-shadow: 0 12px 32px rgba(36, 36, 37, 0.08);
    }

    [data-theme="dark"] {
      --t-canvas: #111112;
      --t-surface: #19191b;
      --t-raised: #232326;
      --t-inset: #27272b;
      --t-text: #f4f3ef;
      --t-sub: #aaa9a4;
      --t-muted: #7e7d79;
      --t-border: rgba(255, 255, 255, 0.09);
      --t-border-strong: #49494d;
      --t-accent: #ffdc51;
      --t-accent-fg: #ffdc51;
      --t-accent-ink: #19191b;
      --t-success: #70d9a4;
      --t-success-bg: rgba(48, 180, 120, 0.14);
      --t-warn: #f2cc60;
      --t-warn-bg: rgba(255, 220, 81, 0.12);
      --t-danger: #f87171;
      --t-danger-bg: rgba(180, 35, 24, 0.18);
      --t-shadow: 0 16px 40px rgba(0, 0, 0, 0.38);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--wb-bg);
      color: var(--wb-text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
    }

    button, input, select { font: inherit; }
    button { cursor: pointer; }

    /* Top Studio Switcher */
    .studio-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(21, 23, 28, 0.94);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--wb-border);
      padding: 10px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .studio-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .studio-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 650;
      font-size: 14px;
      letter-spacing: -0.01em;
    }
    .studio-brand img {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      image-rendering: pixelated;
    }
    .studio-tabs, .studio-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .s-tab {
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.05);
      color: var(--wb-muted);
      padding: 7px 13px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 550;
      transition: 0.16s ease;
    }
    .s-tab:hover { color: #fff; background: rgba(255, 255, 255, 0.09); }
    .s-tab.active {
      background: var(--wb-gold);
      color: var(--wb-gold-ink);
      font-weight: 650;
    }
    .s-group {
      display: inline-flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--wb-border);
      border-radius: 9px;
      padding: 3px;
      gap: 3px;
    }
    .s-group-label {
      font-size: 11px;
      color: var(--wb-muted);
      padding: 0 7px;
    }
    .s-pill {
      border: 0;
      background: transparent;
      color: var(--wb-muted);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 550;
      transition: 0.15s ease;
    }
    .s-pill:hover { color: #fff; }
    .s-pill.active {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }
    .s-pill.gold.active {
      background: var(--wb-gold);
      color: var(--wb-gold-ink);
      font-weight: 650;
    }

    /* Stage */
    .studio-stage {
      flex: 1;
      padding: 28px 20px 48px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .ab-grid {
      display: flex;
      gap: 36px;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
      width: 100%;
      max-width: 1200px;
    }
    .phone-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .variant-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #e5e7eb;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--wb-border);
      padding: 6px 14px;
      border-radius: 999px;
    }
    .variant-tag b {
      color: var(--wb-gold);
      font-weight: 700;
    }

    /* Phone Mock Frame */
    .phone-frame {
      width: 390px;
      height: 790px;
      border-radius: 44px;
      border: 8px solid #26282e;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.08);
      background: var(--t-canvas);
      color: var(--t-text);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .status-bar {
      height: 42px;
      padding: 12px 26px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 650;
      color: var(--t-text);
      flex-shrink: 0;
      user-select: none;
    }
    .status-icons {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
    }
    .phone-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .phone-body::-webkit-scrollbar { display: none; }
    .home-indicator {
      height: 22px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      background: inherit;
    }
    .home-indicator i {
      width: 124px;
      height: 4px;
      border-radius: 99px;
      background: var(--t-border-strong);
      opacity: 0.65;
    }

    /* Twin Login & Common Controls */
    .login-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 20px 22px 28px;
    }
    .login-card {
      background: var(--t-surface);
      border: 1px solid var(--t-border);
      border-radius: 24px;
      padding: 24px 20px;
      box-shadow: var(--t-shadow);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .brand-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 2px;
    }
    .brand-head img {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      image-rendering: pixelated;
      box-shadow: 0 6px 18px rgba(100, 80, 10, 0.12);
    }
    .brand-head h1 {
      margin: 0;
      font-size: 21px;
      font-weight: 680;
      letter-spacing: -0.03em;
    }
    .brand-head p {
      margin: 2px 0 0;
      font-size: 12.5px;
      color: var(--t-sub);
    }

    /* Segmented Switch (Version A) */
    .seg-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--t-inset);
      padding: 3px;
      border-radius: 12px;
      gap: 3px;
    }
    .seg-btn {
      border: 0;
      background: transparent;
      color: var(--t-sub);
      font-size: 13.5px;
      font-weight: 600;
      padding: 8px 0;
      border-radius: 9.5px;
      transition: 0.16s ease;
    }
    .seg-btn.active {
      background: var(--t-surface);
      color: var(--t-text);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
    }

    /* Inputs */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .input-row {
      display: flex;
      align-items: center;
      min-height: 48px;
      border-radius: 14px;
      border: 1px solid var(--t-border-strong);
      background: var(--t-surface);
      overflow: hidden;
      transition: border-color 0.15s ease;
    }
    .input-row:focus-within {
      border-color: #c79f12;
      box-shadow: 0 0 0 3px rgba(255, 220, 81, 0.22);
    }
    .prefix-box {
      padding: 0 12px;
      font-size: 15px;
      font-weight: 600;
      color: var(--t-text);
      border-right: 1px solid var(--t-border);
      height: 48px;
      display: flex;
      align-items: center;
      background: rgba(128, 128, 135, 0.05);
    }
    .bare-input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--t-text);
      padding: 0 13px;
      font-size: 15px;
      height: 46px;
    }
    .bare-input::placeholder { color: var(--t-muted); }
    .mono-input {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      letter-spacing: 0.06em;
      font-weight: 650;
      text-transform: uppercase;
    }
    .inline-action {
      border: 0;
      background: transparent;
      color: var(--t-accent-fg);
      font-size: 13px;
      font-weight: 650;
      padding: 0 13px;
      height: 32px;
      border-left: 1px solid var(--t-border);
      white-space: nowrap;
    }
    .inline-action:disabled {
      color: var(--t-muted);
      cursor: default;
    }
    .inline-badge {
      margin-right: 10px;
      padding: 3px 8px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 650;
      background: var(--t-success-bg);
      color: var(--t-success);
      white-space: nowrap;
    }
    .inline-badge.gold {
      background: var(--t-warn-bg);
      color: var(--t-warn);
    }

    /* Pass Stub Header (Version B) */
    .pass-banner {
      background: linear-gradient(135deg, #1d1e22 0%, #131417 100%);
      color: #f4f3ef;
      border-radius: 16px;
      padding: 13px 15px;
      position: relative;
      border: 1px solid rgba(255, 220, 81, 0.28);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .pass-banner::before, .pass-banner::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--t-surface);
      transform: translateY(-50%);
    }
    .pass-banner::before { left: -7px; border-right: 1px solid rgba(255, 220, 81, 0.28); }
    .pass-banner::after { right: -7px; border-left: 1px solid rgba(255, 220, 81, 0.28); }
    .pass-kicker {
      font-size: 10px;
      font-family: ui-monospace, "SF Mono", monospace;
      letter-spacing: 0.12em;
      color: #ffdc51;
      text-transform: uppercase;
    }
    .pass-code-mini {
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-top: 2px;
    }
    .pass-perk {
      font-size: 11.5px;
      font-weight: 650;
      padding: 4px 9px;
      border-radius: 8px;
      background: rgba(255, 220, 81, 0.14);
      color: #ffdc51;
      white-space: nowrap;
    }

    /* Notice / Capacity Gate */
    .soft-alert {
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 12.5px;
      line-height: 1.45;
      background: var(--t-warn-bg);
      color: var(--t-warn);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Agreement & Primary Button */
    .agree-line {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--t-sub);
      line-height: 1.4;
      cursor: pointer;
      user-select: none;
    }
    .agree-line input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: #242425;
      flex-shrink: 0;
    }
    .agree-line a {
      color: var(--t-accent-fg);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .primary-btn {
      width: 100%;
      min-height: 48px;
      border-radius: 14px;
      border: 0;
      background: var(--t-accent);
      color: #242425;
      font-size: 15px;
      font-weight: 680;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }
    .primary-btn:active { transform: scale(0.98); }
    .primary-btn:disabled { opacity: 0.45; }

    .secondary-btn {
      min-height: 42px;
      border-radius: 12px;
      border: 1px solid var(--t-border-strong);
      background: var(--t-surface);
      color: var(--t-text);
      font-size: 13.5px;
      font-weight: 600;
      padding: 0 14px;
    }

    /* Twin App Topbar & Me / Invite Views */
    .twin-nav {
      min-height: 54px;
      padding: 0 14px;
      display: grid;
      grid-template-columns: 56px 1fr 56px;
      align-items: center;
      border-bottom: 1px solid var(--t-border);
      background: var(--t-surface);
    }
    .twin-nav-back {
      border: 0;
      background: transparent;
      color: var(--t-text);
      font-size: 14px;
      font-weight: 600;
      text-align: left;
      padding: 6px 2px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .twin-nav-title {
      text-align: center;
      font-size: 16px;
      font-weight: 650;
    }
    .twin-content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
    }
    .t-card {
      background: var(--t-surface);
      border: 1px solid var(--t-border);
      border-radius: 20px;
      padding: 16px;
      box-shadow: var(--t-shadow);
    }
    .me-mini-entry {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: var(--t-surface);
      border: 1px solid var(--t-border);
      border-radius: 16px;
      font-size: 13.5px;
    }
    .me-mini-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
    }
    .me-mini-dot {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--t-warn-bg);
      color: var(--t-warn);
      display: grid;
      place-items: center;
      font-size: 14px;
    }
    .code-hero-box {
      background: var(--t-inset);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 12px 0;
    }
    .code-big {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 22px;
      font-weight: 750;
      letter-spacing: 0.06em;
    }
    .btn-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* Ticket Card (Version B Invite Page) */
    .ticket-shell {
      background: linear-gradient(160deg, #1d1e22 0%, #121316 100%);
      color: #f4f3ef;
      border-radius: 22px;
      border: 1px solid rgba(255, 220, 81, 0.3);
      overflow: hidden;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.22);
    }
    .ticket-top {
      padding: 20px 18px 18px;
    }
    .ticket-tear {
      position: relative;
      border-top: 1px dashed rgba(255, 255, 255, 0.18);
      margin: 0;
    }
    .ticket-tear::before, .ticket-tear::after {
      content: "";
      position: absolute;
      top: -9px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--t-canvas);
    }
    .ticket-tear::before { left: -9px; }
    .ticket-tear::after { right: -9px; }
    .ticket-bottom {
      padding: 15px 18px 18px;
      background: rgba(255, 255, 255, 0.02);
    }
    .step-dots {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      color: #9ca3af;
      margin-bottom: 14px;
    }
    .step-node {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .step-node i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4b5563;
      display: inline-block;
    }
    .step-node.done { color: #f4f3ef; font-weight: 600; }
    .step-node.done i { background: #ffdc51; box-shadow: 0 0 0 3px rgba(255, 220, 81, 0.2); }

    /* Reward Card (Weekly Reset) */
    .reward-card {
      border-radius: 18px;
      padding: 14px 16px;
      border: 1px solid rgba(255, 200, 30, 0.4);
      background: var(--t-warn-bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .reward-card.locked {
      border-color: var(--t-border);
      background: var(--t-surface);
      opacity: 0.78;
    }
    .reward-title {
      font-size: 14px;
      font-weight: 650;
      color: var(--t-text);
    }
    .reward-sub {
      font-size: 12px;
      color: var(--t-sub);
      margin-top: 2px;
    }
    .pill-cta {
      border: 0;
      border-radius: 99px;
      background: var(--t-accent);
      color: #242425;
      font-size: 12.5px;
      font-weight: 700;
      padding: 8px 14px;
      white-space: nowrap;
    }

    /* Progress Bars (Unqualified Old User) */
    .prog-item { margin-top: 12px; }
    .prog-head {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 6px;
    }
    .prog-track {
      height: 7px;
      border-radius: 99px;
      background: var(--t-inset);
      overflow: hidden;
    }
    .prog-fill {
      height: 100%;
      border-radius: 99px;
      background: #e5b80b;
    }

    /* Poster Sheet Overlay inside Phone */
    .sheet-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(12, 13, 16, 0.62);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      z-index: 20;
    }
    .sheet-box {
      background: var(--t-surface);
      border-radius: 24px 24px 0 0;
      padding: 18px 18px 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .poster-preview-wrap {
      display: flex;
      justify-content: center;
    }
    .poster-canvas {
      width: 256px;
      height: 368px;
      border-radius: 18px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.22);
    }

    /* Chat Expired Screen */
    .chat-list {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg-user {
      align-self: flex-end;
      background: var(--t-accent);
      color: #242425;
      padding: 10px 14px;
      border-radius: 18px 18px 4px 18px;
      font-size: 14px;
      max-width: 78%;
    }
    .msg-bot {
      align-self: flex-start;
      background: var(--t-surface);
      border: 1px solid var(--t-border);
      color: var(--t-text);
      padding: 11px 14px;
      border-radius: 18px 18px 18px 4px;
      font-size: 14px;
      line-height: 1.5;
      max-width: 84%;
    }
    .expired-inline-bar {
      margin: 8px 12px 10px;
      padding: 11px 13px;
      border-radius: 16px;
      background: var(--t-surface);
      border: 1px solid var(--t-border-strong);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: var(--t-shadow);
    }
    .expired-float-card {
      margin: 8px 14px 12px;
      padding: 16px;
      border-radius: 20px;
      background: var(--t-surface);
      border: 1px solid rgba(255, 200, 30, 0.45);
      box-shadow: var(--t-shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .tab-bar {
      height: 54px;
      border-top: 1px solid var(--t-border);
      background: var(--t-surface);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      place-items: center;
      font-size: 11px;
      color: var(--t-muted);
      flex-shrink: 0;
    }
    .tab-bar span.active { color: var(--t-text); font-weight: 700; }

    /* Surface 4: idbots.world Website Landing */
    .web-stage {
      width: 100%;
      max-width: 1040px;
      background: #f4f0e8;
      color: #171817;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.5);
      border: 1px solid #d8d2c7;
    }
    .web-stage.mobile-mode {

    /* Draw deterministic crisp QR-like pattern + Share Poster on Canvas */
    function drawPosterCanvas(canvas, variant) {
      if (!canvas) return;
      const dpr = 2;
      const w = 256, h = 368;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      const ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);

      if (variant === "A") {
        // Warm Editorial Paper (#F4F0E8) matching idbots.world
        ctx.fillStyle = "#F4F0E8";
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = "#D8D2C7";
        ctx.lineWidth = 1;
        ctx.strokeRect(10, 10, w - 20, h - 20);

        ctx.fillStyle = "#9B581E";
        ctx.font = "600 9.5px ui-monospace, SFMono-Regular, Menlo, monospace";
        ctx.fillText("IDBOTS · INVITE", 24, 34);

        ctx.fillStyle = "#171817";
        ctx.font = "700 20px -apple-system, PingFang SC, sans-serif";
        ctx.fillText("生活在 AI 互联网上的", 24, 66);
        ctx.fillText("自主 Agent 伙伴", 24, 92);

        // Code box
        ctx.fillStyle = "#FFFDF8";
        roundRect(ctx, 24, 114, w - 48, 76, 12, true, false);
        ctx.strokeStyle = "#DFD8CA";
        roundRect(ctx, 24, 114, w - 48, 76, 12, false, true);

        ctx.fillStyle = "#74746D";
        ctx.font = "500 10px -apple-system, PingFang SC, sans-serif";
        ctx.fillText("专属邀请码 · 含 14 天 ID.Student", 36, 136);

        ctx.fillStyle = "#171817";
        ctx.font = "700 21px ui-monospace, SFMono-Regular, Menlo, monospace";
        ctx.fillText("IDB-7K9M-X4", 36, 168);

        // Bottom QR row
        drawMiniQr(ctx, 24, 272, 68, "#171817", "#FFFDF8");
        ctx.fillStyle = "#171817";
        ctx.font = "600 12px -apple-system, PingFang SC, sans-serif";
        ctx.fillText("扫码前往官网注册", 104, 302);
        ctx.fillStyle = "#74746D";
        ctx.font = "500 11px ui-monospace, Menlo, monospace";
        ctx.fillText("idbots.world", 104, 322);
      } else {
        // Dark Gold Geek Pass (#131417)
        const grad = ctx.createLinearGradient(0, 0, w, h);
        grad.addColorStop(0, "#1C1D22");
        grad.addColorStop(1, "#101114");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        ctx.strokeStyle = "rgba(255, 220, 81, 0.32)";
        ctx.lineWidth = 1;
        roundRect(ctx, 12, 12, w - 24, h - 24, 14, false, true);

        ctx.fillStyle = "#FFDC51";
        ctx.font = "700 10px ui-monospace, Menlo, monospace";
        ctx.fillText("CLOUD INVITE PASS", 26, 38);

        roundRect(ctx, 24, 96, w - 48, 96, 12, true, false);
        ctx.strokeStyle = "rgba(255, 220, 81, 0.35)";
        roundRect(ctx, 24, 96, w - 48, 96, 12, false, true);

        ctx.fillStyle = "#FFDC51";
        ctx.font = "700 22px ui-monospace, Menlo, monospace";
        ctx.fillText("IDB-7K9M-X4", 38, 138);

        ctx.fillStyle = "#AAA9A4";
        ctx.font = "500 11px -apple-system, PingFang SC, sans-serif";
        ctx.fillText("激活即享 14 天 ID.Student 云端版", 38, 168);

        // Dashed divider
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = "rgba(255,255,255,0.16)";
        ctx.beginPath();
        ctx.moveTo(24, 238);
        ctx.lineTo(w - 24, 238);
        ctx.stroke();
        ctx.setLineDash([]);

        drawMiniQr(ctx, 24, 266, 70, "#111112", "#F4F3EF");
        ctx.fillStyle = "#F4F3EF";
        ctx.font = "600 12.5px -apple-system, PingFang SC, sans-serif";
        ctx.fillText("扫码激活通行证", 108, 296);
        ctx.fillStyle = "#FFDC51";
        ctx.font = "500 11px ui-monospace, Menlo, monospace";
        ctx.fillText("idbots.world", 108, 318);
      }

      const img = new Image();
      img.onload = () => {
        ctx.save();
        roundRect(ctx, w - 62, 24, 38, 38, 9, false, false);
        ctx.clip();
        ctx.drawImage(img, w - 62, 24, 38, 38);
        ctx.restore();
      };
      img.src = LOGO_DATA_URI;

    function roundRect(ctx, x, y, w, h, r, fill, stroke) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      if (fill) ctx.fill();
      if (stroke) ctx.stroke();
    }

    function drawMiniQr(ctx, x, y, size, fg, bg) {
      ctx.fillStyle = bg;
      roundRect(ctx, x, y, size, size, 8, true, false);
      const cells = 11;
      const pad = 7;
      const cell = (size - pad * 2) / cells;
      ctx.fillStyle = fg;
      const pattern = [
        "11111010111",
        "10001011001",
        "10101001101",
        "10001010011",
        "11111010101",
        "00000011010",
        "11111010110",
        "10001001001",
        "10101011110",
        "10001010011",
        "11111001101"
      ];
      for (let r = 0; r < cells; r++) {
        for (let c = 0; c < cells; c++) {
          if (pattern[r][c] === "1") {
            ctx.fillRect(x + pad + c * cell, y + pad + r * cell, cell - 0.5, cell - 0.5);
          }
        }
      }
    }

        stage.innerHTML = renderWebsite();
        return;
      }
      if (state.surface === "admin") {
        stage.innerHTML = renderAdmin();
        return;
      }

      const renderer =
        state.surface === "login" ? renderLoginPhone :
        state.surface === "invite" ? renderInvitePhone :
        renderExpiredPhone;

      if (state.viewMode === "both") {
        stage.innerHTML = `<div class="ab-grid">${renderer("A")}${renderer("B")}</div>`;
      } else {
        stage.innerHTML = `<div class="ab-grid">${renderer(state.viewMode)}</div>`;
      }

      if (state.surface === "invite" && state.inviteScene === "poster") {
        drawPosterCanvas(document.getElementById("posterCanvas_A"), "A");
        drawPosterCanvas(document.getElementById("posterCanvas_B"), "B");
