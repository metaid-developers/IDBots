const state={destination:'tasks',tab:'tasks',status:'in_progress',search:'',detailId:null,selectedSubtask:'s2',chatTaskId:'t1',newTask:false,appearance:new URLSearchParams(location.search).get('appearance')==='dark'?'dark':'light',sheet:null,scheduleTab:'schedules',editingSchedule:null,delegate:true,extraMessages:[]};
function esc(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function statusBadge(status){const m=statusMeta[status]||statusMeta.done;return `<span class="status-label status-${m.className}"><span class="status-dot"></span>${m.label}</span>`}
function participants(task){return `<div class="participants"><img class="avatar" src="${TWIN}" alt=""><span class="avatar" aria-hidden="true">${task.participants[1]?task.participants[1][0]:''}</span><span class="participant-names">${task.participants.join(' + ')}</span></div>`}
function progress(task){return `<div class="progress-row"><div class="progress-track" aria-label="${task.percent}% complete"><div class="progress-fill" style="width:${task.percent}%"></div></div><span class="progress-value">${task.accepted}/${task.total} · ${task.percent}%</span></div><div class="task-counts"><span>${task.accepted} accepted</span><span>${task.active} active</span><span>${task.pending} pending</span></div>`}
function secondaryTabs(){return `<div class="secondary-tabs" role="tablist" aria-label="Task type"><button role="tab" aria-selected="${state.tab==='tasks'}" data-tab="tasks">Tasks</button><button role="tab" aria-selected="${state.tab==='scheduled'}" data-tab="scheduled">Scheduled</button></div>`}
function bottomNav(active='tasks'){const items=[['chat','chat','Chat'],['browser','browser','Browser'],['tasks','tasks','Tasks'],['me','user','Me']];return `<nav class="bottom-nav" aria-label="Main navigation">${items.map(([id,ico,label])=>`<button data-destination="${id}" aria-current="${active===id?'page':'false'}">${icon(ico)}<span>${label}</span>${id==='tasks'?'<span class="nav-badge">1</span>':''}</button>`).join('')}</nav>`}
function count(status){return tasks.filter(t=>t.status===status).length}
function filteredTasks(){const q=state.search.trim().toLowerCase();return tasks.filter(t=>(state.status==='all'||t.status===state.status)&&(!q||[t.title,t.current,t.live,t.next].join(' ').toLowerCase().includes(q)))}
function taskCard(task){return `<article class="pulse-task" data-task-id="${task.id}"><div class="pulse-rail"><span class="pulse-time">${task.updated}</span><span class="pulse-node status-${task.status}"></span><span class="pulse-line"></span></div><div class="pulse-body">${statusBadge(task.status)}<button class="task-title" data-details="${task.id}">${esc(task.title)}</button>${participants(task)}<div class="current-box"><p class="current-label">Now in this task</p><p class="current-title">${esc(task.current)}</p>${task.live?`<p class="live-note">${esc(task.live)}</p>`:''}<p class="next-action ${task.status==='waiting_owner'?'wait-note':''}"><strong>Next:</strong> ${esc(task.next)}</p></div>${progress(task)}<div class="task-actions"><button class="button button-primary" data-chat="${task.id}">${icon('chat')}Open chat</button><button class="button button-secondary" data-details="${task.id}">Task details${icon('right')}</button></div></div></article>`}
function taskResults(){const list=filteredTasks();if(!list.length)return '<div class="empty">No tasks match this view.<br>Try another status or search phrase.</div>';return list.map(task=>taskCard(task)).join('')}
function tasksView(){return `<section class="pulse-intro"><p>Now</p><h3>${count('in_progress')} tasks in motion.</h3><span>Twin is moving the current steps forward.</span></section><button class="pulse-attention" data-status-select="waiting_owner"><span><strong>Needs you</strong> · ${count('waiting_owner')} decision</span><span>Review${icon('right')}</span></button><div class="search-row"><label class="search-box">${icon('search')}<input data-search value="${esc(state.search)}" placeholder="Search the flow" aria-label="Search tasks or progress"></label><button class="filter-button" data-open-filter>${statusMeta[state.status]?.label||'All tasks'}${icon('down')}</button></div><div class="section-heading"><h3>${statusMeta[state.status]?.label||'All tasks'}</h3><span>${filteredTasks().length} in this flow</span></div><div id="results" class="pulse-list">${taskResults()}</div>`}
function scheduleCard(s){return `<article class="schedule-card"><div class="schedule-head"><div><h3>${esc(s.name)}</h3><p>${esc(s.rule)}</p></div><button class="switch" role="switch" aria-checked="${s.enabled}" aria-label="Enable ${esc(s.name)}" data-schedule-toggle="${s.id}"></button></div><div class="schedule-times"><div><span>Next run</span><strong>${s.running?'Running now':esc(s.next)}</strong></div><div><span>Last result</span><strong>${esc(s.last)}</strong></div></div><div class="schedule-actions"><button class="button button-quiet" data-schedule-run="${s.id}">${icon('play')}${s.running?'Running':'Run now'}</button><button class="button button-quiet" data-schedule-edit="${s.id}">Edit</button><button class="button button-quiet" data-schedule-delete="${s.id}" aria-label="Delete ${esc(s.name)}">${icon('close')}</button></div></article>`}
function scheduledView(){return `<div class="schedule-tools"><div class="mini-tabs" role="tablist" aria-label="Scheduled task views"><button role="tab" aria-selected="${state.scheduleTab==='schedules'}" data-schedule-tab="schedules">Schedules</button><button role="tab" aria-selected="${state.scheduleTab==='history'}" data-schedule-tab="history">History</button></div><button class="small-primary" data-schedule-new>New schedule</button></div>${state.scheduleTab==='schedules'?schedules.map(scheduleCard).join(''):`<div class="history-card">${history.map(h=>`<div class="history-row"><strong>${esc(h.name)}</strong><p>${esc(h.time)} · ${esc(h.status)}</p><button data-chat="t1">Open result session</button></div>`).join('')}</div>`}`}
function mainView(){return `<section class="screen"><header class="topbar"><img class="brand" src="${LOGO}" alt="IDBots"><div class="title-copy"><h2>${state.tab==='tasks'?'Tasks':'Scheduled'}</h2><p>${state.tab==='tasks'?count('in_progress')+' in motion · Live from Studio':'Recurring work, independently managed'}</p></div><button class="icon-button" data-new-task aria-label="${state.tab==='tasks'?'New task':'New schedule'}">${icon('plus')}</button></header>${secondaryTabs()}<div class="content">${state.tab==='tasks'?tasksView():scheduledView()}</div>${bottomNav('tasks')}</section>${state.sheet?renderSheet():''}`}
function subtasksFor(task){return task.id==='t1'?primarySubtasks:[{id:'x1',title:'Scope and preparation',status:'accepted',detail:'Preparation is complete.'},{id:'x2',title:task.current,status:task.status,detail:task.next},{id:'x3',title:'Final review and closeout',status:'pending',detail:'Review the result and close the task.'}]}
function detailView(){const task=tasks.find(t=>t.id===state.detailId)||tasks[0],subs=subtasksFor(task);let selected=subs.find(s=>s.id===state.selectedSubtask)||subs.find(s=>s.status===task.status)||subs[1]||subs[0];return `<section class="detail"><header class="detail-nav"><button class="icon-button" data-back aria-label="Back to tasks">${icon('back')}</button><h2>Task details</h2>${task.status==='paused'?`<button class="button button-primary" data-stage="resume">Resume</button>`:task.status!=='done'?`<button class="button button-secondary" data-stage="pause">Pause</button>`:''}${task.status!=='done'?`<button class="button button-quiet" data-confirm="complete">Complete</button>`:''}</header><div class="detail-scroll"><section class="detail-hero">${statusBadge(task.status)}<h3>${esc(task.title)}</h3><p class="goal">${esc(task.goal)}</p>${participants(task)}${progress(task)}<div class="detail-meta"><span class="delegate">Twin may accept subtasks</span><button class="switch" role="switch" aria-checked="${state.delegate}" aria-label="Delegate acceptance to Twin" data-delegate></button></div></section><section class="detail-section"><h4>Plan page</h4><button class="plan-link" data-plan><span>mobile-task-directions.html</span>${icon('right')}</button></section><section class="detail-section"><h4>Subtasks · dependency order</h4><div class="subtask-list">${subs.map((s,i)=>`<button class="subtask-row" data-subtask="${s.id}" aria-pressed="${selected.id===s.id}"><span class="subtask-index ${s.status==='accepted'?'accepted':s.status===task.status?'current':''}">${s.status==='accepted'?'✓':i+1}</span><span class="subtask-copy"><strong>${esc(s.title)}</strong><span>${statusMeta[s.status]?.label||(s.status==='pending'?'Pending':s.status)}${i>0?' · Depends on previous step':''}</span></span>${selected.id===s.id?icon('right'):''}</button>`).join('')}</div></section><section class="detail-section"><h4>Selected subtask</h4><div class="subtask-detail"><h5>${esc(selected.title)}</h5><p>${esc(selected.detail)}</p><strong style="font-size:12px">Acceptance criteria</strong><ul class="criteria"><li>All six desktop states remain reachable</li><li>Active tasks are visible on first entry</li><li>A bound conversation is one tap away</li></ul>${selected.status==='waiting_owner'?`<div class="verdict-actions"><button class="button button-primary" data-verdict="accept">Accept</button><button class="button button-danger" data-verdict="reject">Send back</button></div>`:''}<div class="evidence-grid"><button class="mini-action" data-plan>Evidence<span>2 design artifacts</span></button><button class="mini-action" data-chat="${task.id}">Bound session<span>Mobile task design · Studio</span></button></div></div></section><section class="detail-section"><h4>Events</h4><div class="event-list"><div class="event"><time>2m ago</time><span class="event-marker"></span><p><strong>Twin · progress</strong><br>${esc(task.live||task.next)}</p></div><div class="event"><time>1h ago</time><span class="event-marker"></span><p><strong>System · began</strong><br>${esc(task.current)}</p></div><div class="event"><time>18 Nov</time><span class="event-marker"></span><p><strong>Owner · created</strong><br>Task created from a Studio conversation</p></div></div></section>${task.status!=='done'?`<button class="button button-danger" style="width:100%;margin-top:12px" data-confirm="cancel">Cancel task</button>`:''}</div><footer class="detail-footer"><button class="button button-primary" data-chat="${task.id}">${icon('chat')}Open chat</button><button class="button button-secondary" data-edit-chat="${task.id}">Edit in chat</button></footer></section>${state.sheet?renderSheet():''}`}
function chatView(){const task=tasks.find(t=>t.id===state.chatTaskId)||tasks[0];return `<section class="screen"><header class="chat-header"><button class="icon-button" data-back aria-label="Back to task">${icon('back')}</button><img class="chat-avatar" src="${TWIN}" alt="Twin Bot"><div class="chat-heading"><h2>Twin Bot</h2><p>${state.newTask?'New task draft':esc(task.title)}</p></div></header><div class="chat-content">${state.newTask?'<p class="message assistant">Describe the outcome you want. I will help define the goal, acceptance criteria, and next step before creating the task.</p>':`<button class="chat-task-link" data-details="${task.id}"><span>Linked task · ${statusMeta[task.status]?.label}</span><strong>${esc(task.title)}</strong><small>${esc(task.current)} · ${task.percent}%</small></button><div class="message user">Please compare the mobile task directions and keep the desktop task model intact.</div><div class="message assistant"><time>Today, 11:42</time>I have kept all six states and made active work the default. I am comparing one-handed filters and detail flows now.</div>`}${state.extraMessages.map(m=>`<div class="message user">${esc(m)}</div>`).join('')}</div><form class="composer" id="chat-form"><input id="chat-input" aria-label="Message Twin" placeholder="Message Twin" value="${state.newTask?'I want to create a task for ':''}"><button aria-label="Send message">↑</button></form>${bottomNav('chat')}</section>`}
function simpleView(kind){const browser=kind==='browser';return `<section class="screen"><div class="simple-placeholder"><div><h2>${browser?'Browser':'Me'}</h2><p>${browser?'Browser remains a separate top-level destination. This design round focuses on Tasks.':'Account and Bot settings remain unchanged in this task-design prototype.'}</p><button class="button button-primary" data-destination="tasks">Return to Tasks</button></div></div>${bottomNav(kind)}</section>`}
function renderSheet(){if(state.sheet==='filter')return `<div class="overlay"><button class="backdrop" data-close-sheet aria-label="Close status menu"></button><section class="sheet" role="dialog" aria-modal="true" aria-label="Filter tasks by status"><div class="sheet-handle"></div><h3>Show tasks</h3><p class="sheet-description">The desktop columns become one thumb-friendly status menu.</p>${['all','in_progress','waiting_owner','waiting_external','defining','paused','done'].map(id=>`<button class="sheet-option" data-status-select="${id}"><span class="option-label">${id==='all'?'All tasks':statusMeta[id].label}</span><span class="count">${id==='all'?tasks.length:count(id)}</span>${state.status===id?icon('check'):''}</button>`).join('')}</section></div>`;
if(state.sheet==='schedule-form'){const s=schedules.find(x=>x.id===state.editingSchedule);return `<div class="overlay"><button class="backdrop" data-close-sheet aria-label="Close schedule editor"></button><section class="sheet" role="dialog" aria-modal="true"><div class="sheet-handle"></div><h3>${s?'Edit schedule':'New schedule'}</h3><p class="sheet-description">Recurring triggers stay separate from unified tasks.</p><label class="form-label">Name<input class="form-input" id="schedule-name" value="${s?esc(s.name):''}" placeholder="Schedule name"></label><label class="form-label">Prompt<textarea class="form-input" rows="3" id="schedule-prompt" placeholder="What should Twin do?">${s?'Prepare the result and link the run session.':''}</textarea></label><label class="form-label">Schedule<input class="form-input" id="schedule-rule" value="${s?esc(s.rule):'Every day at 09:00'}"></label><div class="sheet-buttons"><button class="button button-secondary" data-close-sheet>Cancel</button><button class="button button-primary" data-schedule-save>Save schedule</button></div></section></div>`}
if(state.sheet==='delete-schedule'){const s=schedules.find(x=>x.id===state.editingSchedule);return `<div class="overlay"><button class="backdrop" data-close-sheet aria-label="Cancel delete"></button><section class="sheet"><div class="sheet-handle"></div><h3>Delete schedule?</h3><p class="sheet-description">${esc(s?.name||'This schedule')} and its future runs will be removed. Existing result sessions stay available.</p><div class="sheet-buttons"><button class="button button-secondary" data-close-sheet>Keep schedule</button><button class="button button-danger" data-schedule-delete-confirm>Delete</button></div></section></div>`}
if(state.sheet==='confirm')return `<div class="overlay"><button class="backdrop" data-close-sheet aria-label="Cancel action"></button><section class="sheet"><div class="sheet-handle"></div><h3>${state.confirmAction==='complete'?'Complete this task?':'Cancel this task?'}</h3><p class="sheet-description">${state.confirmAction==='complete'?'Use this when the goal is met. Remaining open subtasks will be skipped.':'The task will stop. Its conversations and event history remain available.'}</p><div class="sheet-buttons"><button class="button button-secondary" data-close-sheet>Back</button><button class="button ${state.confirmAction==='complete'?'button-primary':'button-danger'}" data-confirm-yes>${state.confirmAction==='complete'?'Complete task':'Cancel task'}</button></div></section></div>`;
if(state.sheet==='reject')return `<div class="overlay"><button class="backdrop" data-close-sheet aria-label="Cancel rejection"></button><section class="sheet"><div class="sheet-handle"></div><h3>Send back for rework</h3><p class="sheet-description">Explain what should change. The subtask returns to In progress.</p><textarea class="form-input" id="reject-note" rows="3" placeholder="What should Twin revise?"></textarea><div class="sheet-buttons"><button class="button button-secondary" data-close-sheet>Cancel</button><button class="button button-danger" data-reject-confirm>Send back</button></div></section></div>`;return ''}
function render(){$('phone').dataset.appearance=state.appearance;document.querySelector('[data-appearance-toggle]').textContent=state.appearance==='light'?'Dark appearance':'Light appearance';if(state.destination==='browser'||state.destination==='me')$('app').innerHTML=simpleView(state.destination);else if(state.destination==='chat')$('app').innerHTML=chatView();else if(state.detailId)$('app').innerHTML=detailView();else $('app').innerHTML=mainView()}
function notify(text){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.textContent=text;$('phone').appendChild(el);setTimeout(()=>el.remove(),2200)}
function openChat(id,edit=false){state.chatTaskId=id||state.detailId||'t1';state.newTask=false;state.destination='chat';state.detailId=null;state.sheet=null;if(edit)state.extraMessages=[];render();if(edit)setTimeout(()=>{const input=$('chat-input');if(input){input.value='Please update this task: ';input.focus();input.setSelectionRange(input.value.length,input.value.length)}},0)}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;
if(b.hasAttribute('data-appearance-toggle')){state.appearance=state.appearance==='light'?'dark':'light';render();return}
if(b.dataset.tab){state.tab=b.dataset.tab;state.sheet=null;render();return}
if(b.dataset.destination){state.destination=b.dataset.destination;if(state.destination==='chat')state.chatTaskId=state.detailId||state.chatTaskId;state.detailId=null;render();return}
if(b.dataset.statusSelect){state.status=b.dataset.statusSelect;state.sheet=null;state.tab='tasks';state.detailId=null;state.destination='tasks';render();return}
if(b.hasAttribute('data-open-filter')){state.sheet='filter';render();return}
if(b.hasAttribute('data-close-sheet')){state.sheet=null;render();return}
if(b.dataset.details){state.detailId=b.dataset.details;state.destination='tasks';state.sheet=null;render();return}
if(b.hasAttribute('data-back')){if(state.destination==='chat'){state.destination='tasks';state.detailId=state.newTask?null:state.chatTaskId;state.newTask=false}else state.detailId=null;state.sheet=null;render();return}
if(b.dataset.chat){openChat(b.dataset.chat);return}
if(b.dataset.editChat){openChat(b.dataset.editChat,true);return}
if(b.hasAttribute('data-new-task')){if(state.tab==='scheduled'){state.editingSchedule=null;state.sheet='schedule-form';render()}else{state.newTask=true;state.destination='chat';state.detailId=null;state.extraMessages=[];render()}return}
if(b.hasAttribute('data-delegate')){state.delegate=!state.delegate;render();notify(state.delegate?'Twin acceptance enabled':'Owner acceptance required');return}
if(b.dataset.subtask){state.selectedSubtask=b.dataset.subtask;render();return}
if(b.dataset.stage){const task=tasks.find(t=>t.id===state.detailId);task.status=b.dataset.stage==='pause'?'paused':'in_progress';render();notify(b.dataset.stage==='pause'?'Task paused':'Task resumed');return}
if(b.dataset.confirm){state.confirmAction=b.dataset.confirm;state.sheet='confirm';render();return}
if(b.hasAttribute('data-confirm-yes')){const task=tasks.find(t=>t.id===state.detailId);task.status='done';if(state.confirmAction==='complete'){task.accepted=task.total;task.pending=0;task.active=0;task.percent=100}state.sheet=null;render();notify(state.confirmAction==='complete'?'Task completed':'Task cancelled');return}
if(b.dataset.verdict==='accept'){const task=tasks.find(t=>t.id===state.detailId);task.status='in_progress';task.next='Continue to final review and closeout';render();notify('Subtask accepted');return}
if(b.dataset.verdict==='reject'){state.sheet='reject';render();return}
if(b.hasAttribute('data-reject-confirm')){const task=tasks.find(t=>t.id===state.detailId);task.status='in_progress';task.next=$('reject-note')?.value||'Revise the subtask and submit again';state.sheet=null;render();notify('Returned to In progress');return}
if(b.hasAttribute('data-plan')){notify('Design artifact preview');return}
if(b.dataset.scheduleTab){state.scheduleTab=b.dataset.scheduleTab;render();return}
if(b.hasAttribute('data-schedule-new')){state.editingSchedule=null;state.sheet='schedule-form';render();return}
if(b.dataset.scheduleToggle){const s=schedules.find(x=>x.id===b.dataset.scheduleToggle);s.enabled=!s.enabled;s.next=s.enabled?'Tomorrow, 09:00':'Paused';render();return}
if(b.dataset.scheduleRun){const s=schedules.find(x=>x.id===b.dataset.scheduleRun);s.running=true;render();setTimeout(()=>{s.running=false;s.last='Completed · Just now';if(state.tab==='scheduled')render()},1200);return}
if(b.dataset.scheduleEdit){state.editingSchedule=b.dataset.scheduleEdit;state.sheet='schedule-form';render();return}
if(b.dataset.scheduleDelete){state.editingSchedule=b.dataset.scheduleDelete;state.sheet='delete-schedule';render();return}
if(b.hasAttribute('data-schedule-delete-confirm')){const index=schedules.findIndex(x=>x.id===state.editingSchedule);if(index>=0)schedules.splice(index,1);state.sheet=null;render();notify('Schedule deleted');return}
if(b.hasAttribute('data-schedule-save')){const name=$('schedule-name').value.trim(),rule=$('schedule-rule').value.trim();if(!name){notify('Enter a schedule name');return}if(state.editingSchedule){const s=schedules.find(x=>x.id===state.editingSchedule);s.name=name;s.rule=rule}else schedules.unshift({id:'sc'+Date.now(),name,rule,next:'Tomorrow, 09:00',last:'Never run',enabled:true,running:false});state.sheet=null;render();notify('Schedule saved');return}
});
document.addEventListener('input',event=>{if(event.target.matches('[data-search]')){state.search=event.target.value;$('results').innerHTML=taskResults()}});
document.addEventListener('submit',event=>{if(event.target.id==='chat-form'){event.preventDefault();const input=$('chat-input'),text=input.value.trim();if(!text)return;state.extraMessages.push(text);render();setTimeout(()=>$('chat-input')?.focus(),0)}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.sheet){state.sheet=null;render()}});
render();
</script>
</body>
</html>
