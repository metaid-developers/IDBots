<title>IDBots Mobile Direction B · Cupertino Clarity</title>
<!--
  IDBots mobile chat UI direction B: Cupertino clarity.

  Assumptions and reasoning:
  * This is a visual and interaction direction prototype, not production code. It renders one
    interactive iPhone at actual size (393 x 852 logical pixels) using the supplied IosFrame
    component verbatim, with a review label and a light/dark appearance control outside the phone.
  * Direction B is a benchmark migration from Apple's current Human Interface Guidelines and
    familiar iOS messaging patterns: a conventional translucent navigation bar with a text based
    back affordance and centered conversation identity, grouped message bubbles with restrained
    timestamps, the itinerary result integrated into the assistant turn (not a floating dashboard
    widget), a distinct input accessory, and a floating material tab bar. Blur/material is used
    only for navigation and controls, never for content bubbles.
  * Sample data status: all conversation copy, follow ups, tabs, and the result card use the shared
    sample content from design-spec.md exactly. The itinerary rows inside the "View plan" sheet are
    invented sample filler for the detail view only, clearly marked as sample content.
  * Placeholders: the back button, attachment picker, voice entry, and secondary list rows are
    stubbed with local toasts because this prototype has no network and no native capabilities.
    Sending a message or tapping a follow up inserts a local user message only; no fake AI reply.
  * Icons are Heroicons v2 outline paths (MIT licensed) inlined as JSX; no decorative invented SVG.
  * React 18.3.1 and Babel standalone 7.29.0 load from pinned unpkg CDN tags with integrity
    hashes, so the file opens directly via file:// but needs network access on first load.
  * Both appearances preserve contrast: body text at least 15px, supporting text at least 12px,
    primary touch targets at least 44px, and prefers-reduced-motion is honored.
-->

    box-shadow: 0 0 0 0.5px var(--hairline-strong), 0 8px 22px rgba(0, 0, 0, 0.08);
  }
  .profile-name { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: var(--text); }
  .profile-sub { font-size: 13px; color: var(--secondary); }

  /* ------------------------------------------------------------------ */
  /* Plan detail sheet                                                   */
  /* ------------------------------------------------------------------ */
  .sheet-root { position: absolute; inset: 0; z-index: 40; pointer-events: none; }
  .sheet-root.open { pointer-events: auto; }
  .sheet-backdrop {
    position: absolute;
    inset: 0;
    background: var(--backdrop);
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .sheet-root.open .sheet-backdrop { opacity: 1; }
  .sheet {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    max-height: 82%;
    display: flex;
    flex-direction: column;
    background: var(--sheet-bg);
    border-radius: 22px 22px 0 0;
    box-shadow: 0 -12px 44px rgba(0, 0, 0, 0.28);
    transform: translateY(103%);
    transition: transform 0.36s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .sheet-root.open .sheet { transform: translateY(0); }
  .grabber {
    width: 38px;
    height: 5px;
    border-radius: 999px;
    background: var(--hairline-strong);
    margin: 9px auto 2px;
    flex: 0 0 auto;
  }
  .sheet-head {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px 12px;
  }
  .sheet-head-text { flex: 1 1 auto; min-width: 0; }
  .sheet-title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: var(--text); }
  .sheet-sub { font-size: 13px; color: var(--secondary); margin-top: 2px; }
  .sheet-close {
    appearance: none;
    border: 0;
    margin: 0;
    flex: 0 0 auto;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--field);
    color: var(--secondary);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: transform 0.1s ease;
  }
  .sheet-close:active { transform: scale(0.9); }
  .sheet-body {
    overflow-y: auto;
    padding: 2px 16px 40px;
    scrollbar-width: none;
  }
  .sheet-body::-webkit-scrollbar { display: none; }
  .day-block { margin-top: 16px; }
  .day-label {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text);
    margin: 0 2px 8px;
  }
  .day-label svg { color: var(--accent-deep); }
  .app[data-appearance="dark"] .day-label svg { color: var(--accent); }
  .plan-row {
    display: flex;
    align-items: center;
    gap: 11px;
    background: var(--panel);
    border: 0.5px solid var(--hairline-strong);
    border-radius: 14px;
    padding: 13px 14px;
    margin-bottom: 8px;
  }
  .plan-row svg { flex: 0 0 auto; color: var(--secondary); }
  .plan-row .plan-text { font-size: 15px; line-height: 1.35; color: var(--text); }
  .sheet-note {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    margin: 18px 2px 0;
    padding: 12px 14px;
    border-radius: 14px;
    background: var(--panel);
    border: 0.5px solid var(--hairline-strong);
    font-size: 13px;
    line-height: 1.45;
    color: var(--secondary);
  }
  .sheet-note svg { flex: 0 0 auto; margin-top: 1px; color: var(--accent-deep); }
  .app[data-appearance="dark"] .sheet-note svg { color: var(--accent); }

  /* ------------------------------------------------------------------ */
  /* Toast                                                               */
  /* ------------------------------------------------------------------ */
  .toast {
    position: absolute;
    left: 50%;
    bottom: 88px;
    transform: translateX(-50%) translateY(8px);
    z-index: 60;
    background: var(--toast-bg);
    color: var(--toast-text);
    font-size: 13px;
    font-weight: 500;
    padding: 11px 16px;
    border-radius: 999px;
    box-shadow: 0 8px 26px rgba(0, 0, 0, 0.25);
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
    max-width: 88%;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: opacity 0.22s ease, transform 0.22s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .msg-in { animation: msg-in 0.28s cubic-bezier(0.3, 0.8, 0.4, 1) both; }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(10px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>

  return (
    <div style={iosFrameStyles.wrapper}>

        ...iosFrameStyles.screen,

                <path d="M3 7.5a7 7 0 0110 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" />

                  width: `${battery}%`,
                  height: '100%',
                  background: 'currentColor',
                  borderRadius: 1,
                  opacity: 0.9,
                }} />
                <div style={iosFrameStyles.batteryCap} />
              </div>
            </div>
          </div>
        )}

        {showDynamicIsland && <div style={iosFrameStyles.dynamicIsland} />}

        <div style={iosFrameStyles.content}>
          {children}
        </div>

        {showHomeIndicator && (
          <div style={{
            ...iosFrameStyles.homeIndicator,
            ...(darkMode ? iosFrameStyles.homeIndicatorDark : {}),
          }} />
        )}
      </div>
    </div>
  );
}

if (typeof window !== 'undefined') {
  window.IosFrame = IosFrame;
}

  resultAction: 'View plan',
  followUps: ['Make it food-focused', 'Add a museum', 'Save as a task'],
  placeholder: 'Message Twin',
  tabs: ['Chat', 'Tasks', 'Me'],
};

let nextId = 100;

function ChatNav({ onBack, onNew }) {
  return (
    <div className="navbar">
      <div className="nav-lead">
        <button type="button" className="text-button" onClick={onBack} aria-label="Back to chat list">
          <Icon name="chevron-left" size={20} strokeWidth={2} />
          Chats
        </button>
      </div>
      <div className="nav-center">
        <img className="nav-avatar" src={TWIN_URL} alt="Twin Bot" />
        <div className="nav-titles">
          <div className="nav-title">{SAMPLE.conversationTitle}</div>
          <div className="nav-subtitle">{SAMPLE.botName}</div>
        </div>
      </div>
      <div className="nav-trail">
        <button type="button" className="icon-button" onClick={onNew} aria-label="New conversation">
          <Icon name="square-pen" size={22} />
        </button>
      </div>
    </div>
  );
}

function Composer({ onSend, toast }) {
  const [text, setText] = useState('');
  const [trayOpen, setTrayOpen] = useState(false);
  const [recording, setRecording] = useState(false);
  const recTimer = useRef(null);

  useEffect(() => () => clearTimeout(recTimer.current), []);

  const submit = (e) => {
    e.preventDefault();
    const trimmed = text.trim();
    if (!trimmed) return;
    onSend(trimmed);
    setText('');
  };

  const toggleMic = () => {
    if (recording) {
      clearTimeout(recTimer.current);
      setRecording(false);
      toast('Voice entry is stubbed in this prototype');
    } else {
      setRecording(true);
      toast('Listening… tap the mic again to stop');
      recTimer.current = setTimeout(() => {
        setRecording(false);
        toast('Voice entry is stubbed in this prototype');
      }, 5000);
    }
  };

  return (
    <div className="composer-wrap">
      <div className={trayOpen ? 'attachment-tray open' : 'attachment-tray'}>
        <button type="button" className="tray-item" onClick={() => toast('Camera is not wired up in this prototype')}>
          <Icon name="camera" size={20} />
          Camera
        </button>
        <button type="button" className="tray-item" onClick={() => toast('Photo library is not wired up in this prototype')}>
          <Icon name="photo" size={20} />
          Photo Library
        </button>
      </div>
      <form className="composer" onSubmit={submit}>
        <button
          type="button"
          className="round-btn"
          onClick={() => setTrayOpen(!trayOpen)}
          aria-label="Add attachment"
          aria-expanded={trayOpen}
        >
          <span className="disc"><Icon name="plus" size={20} strokeWidth={1.8} /></span>
        </button>
        <label className="field" style={{ flex: 1 }}>
          <input
            type="text"
            value={text}
            onChange={(e) => setText(e.target.value)}
            placeholder={SAMPLE.placeholder}
            aria-label={SAMPLE.placeholder}
          />
        </label>
        <button
          type="button"
          className={recording ? 'round-btn recording' : 'round-btn'}
          onClick={toggleMic}
          aria-label="Voice input"
        >
          <span className="disc"><Icon name="microphone" size={20} /></span>
        </button>
        <button type="submit" className={text.trim() ? 'send-btn visible' : 'send-btn'} aria-label="Send message">
          <span className="disc"><Icon name="paper-airplane" size={18} /></span>
        </button>
      </form>
    </div>
  );
}

function ChatScreen({ onOpenPlan, toast }) {
  const [messages, setMessages] = useState([]);
  const scrollRef = useRef(null);

  useEffect(() => {
    const el = scrollRef.current;
    if (el) el.scrollTop = el.scrollHeight;
  }, [messages]);

  const send = (text) => setMessages((ms) => ms.concat([{ id: nextId++, text }]));

  return (
    <div className="screen" key="chat-screen">
      <ChatNav
        onBack={() => toast('Chat list is not part of this prototype')}
        onNew={() => toast('New conversations are stubbed in this prototype')}
      />
      <div className="transcript" ref={scrollRef}>
        <div className="day-stamp">Today 9:41 AM</div>

        <div className="msg-row">
          <div className="bubble user g-single">{SAMPLE.userRequest}</div>
        </div>

        <div className="a-group">
          <img className="group-avatar" src={TWIN_URL} alt="" />
          <div className="a-stack">
            <div className="bubble assistant g-single">{SAMPLE.assistantAnswer}</div>
            <div className="work-note">
              <Icon name="check-circle" size={14} strokeWidth={1.6} />
              {SAMPLE.workSummary}
            </div>
            <div className="result-card">
              <div className="result-head">
                <div className="result-tile"><Icon name="map-pin" size={20} /></div>
                <div>
                  <div className="result-title">{SAMPLE.resultTitle}</div>
                  <div className="result-detail">{SAMPLE.resultDetail}</div>
                </div>
              </div>
              <button type="button" className="result-action" onClick={onOpenPlan}>
                {SAMPLE.resultAction}
                <Icon name="chevron-right" size={16} strokeWidth={2} />
              </button>
            </div>
          </div>
        </div>

        {messages.map((m, i) => {
          const n = messages.length;
          const pos = n === 1 ? 'g-single' : i === 0 ? 'g-first' : i === n - 1 ? 'g-last' : 'g-middle';
          return (
            <div className="msg-row msg-in" key={m.id}>
              <div className={'bubble user ' + pos}>{m.text}</div>
            </div>
          );
        })}
      </div>
      <div className="suggestions">
        {SAMPLE.followUps.map((f) => (
          <button type="button" className="chip" key={f} onClick={() => send(f)}>{f}</button>
        ))}
      </div>
      <Composer onSend={send} toast={toast} />
    </div>
  );
}

function TasksScreen({ onOpenPlan, toast }) {
  return (
    <div className="screen" key="tasks-screen">
      <div className="navbar large">
        <div className="nav-lead" />
        <div className="nav-center" style={{ justifyContent: 'flex-start' }}>
          <div className="large-title">Tasks</div>
        </div>
        <div className="nav-trail" />
      </div>
      <div className="list-content">
        <div className="section-label">Active</div>
        <div className="card-group">
          <button type="button" className="list-row" onClick={onOpenPlan}>
            <span className="row-icon solid"><Icon name="check-circle" size={19} /></span>
            <span className="row-texts">
              <span className="row-title" style={{ display: 'block' }}>{SAMPLE.conversationTitle}</span>
              <span className="row-sub" style={{ display: 'block' }}>Plan ready · {SAMPLE.resultDetail}</span>
            </span>
            <span className="row-chevron"><Icon name="chevron-right" size={18} /></span>
          </button>
          <button type="button" className="list-row" onClick={() => toast('This task is sample content for the prototype')}>
            <span className="row-icon"><Icon name="clock" size={19} /></span>
            <span className="row-texts">
              <span className="row-title" style={{ display: 'block' }}>Museum shortlist</span>
              <span className="row-sub" style={{ display: 'block' }}>Suggested by {SAMPLE.botName}</span>
            </span>
            <span className="row-chevron"><Icon name="chevron-right" size={18} /></span>
          </button>
        </div>
      </div>
    </div>
  );
}

function MeScreen({ appearance, onToggleAppearance, toast }) {
  return (
    <div className="screen" key="me-screen">
      <div className="navbar large">
        <div className="nav-lead" />
        <div className="nav-center" style={{ justifyContent: 'flex-start' }}>
          <div className="large-title">Me</div>
        </div>
        <div className="nav-trail" />
      </div>
      <div className="list-content">
        <div className="profile-hero">
          <img src={TWIN_URL} alt="Twin Bot" />
          <div className="profile-name">{SAMPLE.botName}</div>
          <div className="profile-sub">Your personal Twin Bot</div>
        </div>
        <div className="section-label">General</div>
        <div className="card-group">
          <button type="button" className="list-row" onClick={onToggleAppearance}>
            <span className="row-icon"><Icon name={appearance === 'dark' ? 'sun' : 'moon'} size={19} /></span>
            <span className="row-texts">
              <span className="row-title" style={{ display: 'block' }}>Appearance</span>
              <span className="row-sub" style={{ display: 'block' }}>{appearance === 'dark' ? 'Dark' : 'Light'}</span>
            </span>
            <span className="row-chevron"><Icon name="chevron-right" size={18} /></span>
          </button>
          <button type="button" className="list-row" onClick={() => toast('IDBots, an open-source app for raising MetaBots')}>
            <span className="row-icon">
              <img src={LOGO_URL} alt="" style={{ width: 21, height: 21, borderRadius: 5 }} />
            </span>
            <span className="row-texts">
              <span className="row-title" style={{ display: 'block' }}>About IDBots</span>
              <span className="row-sub" style={{ display: 'block' }}>Sample design direction</span>
            </span>
            <span className="row-chevron"><Icon name="chevron-right" size={18} /></span>
          </button>
        </div>
      </div>
    </div>
  );
}

function TabBar({ active, onChange }) {
  const tabs = [
    { id: 'chat', label: SAMPLE.tabs[0], icon: 'chat' },
    { id: 'tasks', label: SAMPLE.tabs[1], icon: 'queue-list' },
    { id: 'me', label: SAMPLE.tabs[2], icon: 'user' },
  ];
  return (
    <nav className="tabbar" aria-label="Top level sections">
      {tabs.map((t) => (
        <button
          type="button"
          key={t.id}
          className={active === t.id ? 'tab active' : 'tab'}
          onClick={() => onChange(t.id)}
          aria-current={active === t.id ? 'page' : undefined}
        >
          <span className="glyph"><Icon name={t.icon} size={23} /></span>
          {t.label}
        </button>
      ))}
    </nav>
  );
}

function PlanSheet({ open, onClose }) {
  return (
    <div className={open ? 'sheet-root open' : 'sheet-root'} aria-hidden={!open}>
      <div className="sheet-backdrop" onClick={onClose} />
      <div className="sheet" role="dialog" aria-modal="true" aria-label={SAMPLE.resultTitle}>
        <div className="grabber" />
        <div className="sheet-head">
          <div className="sheet-head-text">
            <div className="sheet-title">{SAMPLE.resultTitle}</div>
            <div className="sheet-sub">{SAMPLE.botName} · Sample itinerary</div>
          </div>
          <button type="button" className="sheet-close" onClick={onClose} aria-label="Close plan">
            <Icon name="x-mark" size={15} strokeWidth={2} />
          </button>
        </div>
        <div className="sheet-body">
          <div className="day-block">
            <div className="day-label"><Icon name="calendar-days" size={16} strokeWidth={1.8} />Saturday</div>
            {['Slow loop around West Lake', 'Tea stop by the water', 'Late lunch near the lake'].map((t) => (
              <div className="plan-row" key={t}>
                <Icon name="map-pin" size={17} />
                <span className="plan-text">{t}</span>
              </div>
            ))}
          </div>
          <div className="day-block">
            <div className="day-label"><Icon name="calendar-days" size={16} strokeWidth={1.8} />Sunday</div>
            {['Longjing village walk', 'Tea house afternoon', 'Easy evening back in town'].map((t) => (
              <div className="plan-row" key={t}>
                <Icon name="map-pin" size={17} />
                <span className="plan-text">{t}</span>
              </div>
            ))}
          </div>
          <div className="sheet-note">
            <Icon name="check-circle" size={16} strokeWidth={1.6} />
            <span>{SAMPLE.workSummary} Itinerary rows are sample filler for this design direction.</span>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [activeTab, setActiveTab] = useState('chat');
  const [appearance, setAppearance] = useState('light');
  const [sheetOpen, setSheetOpen] = useState(false);
  const [toastState, setToastState] = useState(null);
  const toastTimer = useRef(null);

  useEffect(() => {
    const handler = (e) => setAppearance(e.detail);
    window.addEventListener('appearance-request', handler);
    return () => window.removeEventListener('appearance-request', handler);
  }, []);

  useEffect(() => {
    document.body.dataset.appearance = appearance;
    document.getElementById('seg-light').setAttribute('aria-pressed', appearance === 'light' ? 'true' : 'false');
    document.getElementById('seg-dark').setAttribute('aria-pressed', appearance === 'dark' ? 'true' : 'false');
  }, [appearance]);

  const toast = (text) => {
    clearTimeout(toastTimer.current);
    setToastState({ text, key: Date.now() });
    toastTimer.current = setTimeout(() => setToastState(null), 2300);
  };

  return (
    <IosFrame width={393} height={852} time="9:41" battery={100} darkMode={appearance === 'dark'}>
      <div className="app" data-appearance={appearance}>
        {activeTab === 'chat' && (
          <ChatScreen onOpenPlan={() => setSheetOpen(true)} toast={toast} />
        )}
        {activeTab === 'tasks' && (
          <TasksScreen onOpenPlan={() => setSheetOpen(true)} toast={toast} />
        )}
        {activeTab === 'me' && (
          <MeScreen appearance={appearance} onToggleAppearance={() => {
            setAppearance(a => (a === 'light' ? 'dark' : 'light'));
            toast('Appearance updated');
          }} toast={toast} />
        )}
        <TabBar active={activeTab} onChange={setActiveTab} />
        <PlanSheet open={sheetOpen} onClose={() => setSheetOpen(false)} />
        <div className={toastState ? 'toast show' : 'toast'} key={toastState ? toastState.key : 'none'}>
          {toastState ? toastState.text : ''}
        </div>
      </div>
    </IosFrame>
  );
}

ReactDOM.createRoot(document.getElementById('phone-mount')).render(<App />);

document.getElementById('seg-light').addEventListener('click', () => {
  document.body.dataset.appearance = 'light';
  window.dispatchEvent(new CustomEvent('appearance-request', { detail: 'light' }));
});
document.getElementById('seg-dark').addEventListener('click', () => {
  document.body.dataset.appearance = 'dark';
  window.dispatchEvent(new CustomEvent('appearance-request', { detail: 'dark' }));
});
</script>
</body>
</html>
