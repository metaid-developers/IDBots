<title>IDBots Mobile · Direction A · Friendly Tactile Companion</title>
<!--
  IDBots mobile chat · Direction A: Friendly tactile companion
  =====================================================================
  Assumptions and reasoning
  - Direction A interprets "Friendly Geometric Candy" as soft-touch physical
    feedback: generous radii, soft diffuse shadows, and press states that
    compress (scale down ~5 percent). Candy colors, cartoon decoration and
    loud elevation are deliberately removed; one brand yellow (#FFDC51)
    carries every accent on cool neutral surfaces.
  - The signature object is the tactile result module: an intentionally
    asymmetric card (deeper left inset than right) with the real Twin Bot
    avatar stud on its left edge, reading as the Bot handing the finished
    plan to the user. The whole module is the press target and opens the
    plan sheet with a spring transition.
  - The composer is a raised rounded bar and the tab bar floats above the
    content with a sliding yellow capsule for the tactile selected state.
  - Sample data: all conversation copy, the result module, the plan sheet,
    the seeded task and the three tabs come verbatim from the shared sample
    content in design-spec.md. The only derived sample content is the
    itinerary inside the plan sheet (daypart labels and short notes), which
    the spec asks for ("useful sample itinerary content") without fake
    precision such as exact times.
  - Placeholders: none visually. Attachment and voice controls give visible
    local feedback (a transient note above the composer, a local listening
    state) instead of pretending a native capability completed. Follow-up
    chips and the composer only insert local user messages; no network or
    fake AI reply. Me-screen rows and the header menu show the same local
    feedback note.
  - iPhone chrome: this file embeds a 1:1 transcription of the supplied
    ios_frame.jsx (same wrapper, screen, status bar with signal, wifi and
    battery glyphs, Dynamic Island, home indicator and 393x852 logical
    screen). It is rendered with vanilla DOM so the file opens offline via
    file:// with no CDN dependency. Only the two appearance-dependent
    chrome colors (status text, screen fill, home indicator) are driven by
    CSS so the working appearance toggle stays live.
  - Icons: Heroicons v2 outline set (MIT), path data copied from the
    repository's own node_modules/@heroicons/react install. No invented
    decorative SVG paths and no emoji used as interface icons.
  - Typography: native system stack per brand-spec. Body text is 15px or
    larger, supporting text 12px or larger. Touch targets are at least
    44px inside the phone.
  - Motion: restrained to tab selection (sliding capsule), screen changes,
    sheet transition, message insertion, and press feedback. A mic
    equalizer hints the local listening state. Everything is disabled under
    prefers-reduced-motion.
  - Accessibility: semantic color tokens as CSS custom properties on
    html[data-appear], AA-checked contrast pairs, focus-visible outlines,
    aria labels on icon-only controls.
-->

  .frame-island { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 124px; height: 36px; background: #000; border-radius: 999px; z-index: 30; }

  .frame-signal { display: flex; align-items: flex-end; gap: 2px; height: 12px; }

  .frame-content { position: absolute; top: 54px; left: 0; right: 0; bottom: 34px; overflow: auto; }

  .transcript { flex: 1 1 auto; overflow-y: auto; padding: 0 14px 8px; scroll-behavior: smooth; }
  .daypill { display: table; margin: 0 auto; font-size: 12px; font-weight: 600; color: var(--text-2); background: var(--inset); border-radius: 999px; padding: 4px 10px; }
  .msgrow { display: flex; justify-content: flex-end; margin-top: 8px; }
  .bubble-user { max-width: 80%; background: var(--accent); color: var(--on-accent); font-size: 15px; line-height: 1.38; padding: 9px 14px; border-radius: 21px 21px 6px 21px; box-shadow: var(--sh-sm); white-space: pre-wrap; word-break: break-word; animation: msg-in .22s ease-out; }
  @keyframes msg-in { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }

  .agroup { background: var(--surface); border-radius: 24px; padding: 11px 14px; box-shadow: var(--sh-sm); margin-top: 6px; }
  .atext { font-size: 15px; line-height: 1.45; }
  .workpill { margin-top: 8px; display: inline-flex; align-items: center; gap: 6px; background: var(--work-bg); color: var(--work-fg); font-size: 13px; font-weight: 600; padding: 5px 10px; border-radius: 999px; line-height: 1.3; }
  .workpill svg { width: 15px; height: 15px; flex: 0 0 auto; }

  /* ---------- Tactile result module (signature object) ---------- */
  .result { position: relative; display: block; width: calc(100% - 58px); margin: 12px 14px 2px 44px; background: var(--surface); border: 0; border-radius: 26px; box-shadow: var(--sh-md); padding: 13px 15px 13px; cursor: pointer; text-align: left; font: inherit; color: inherit; transition: transform .14s ease, box-shadow .14s ease; }
  .result:active { transform: scale(.972); box-shadow: var(--sh-sm); }
  .stud { position: absolute; left: -17px; top: 14px; width: 37px; height: 37px; border-radius: 50%; background: var(--surface); padding: 2px; box-shadow: var(--sh-sm); }

  .rm-eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--accent-deep); }
  .rm-title { font-size: 18px; font-weight: 800; letter-spacing: -.01em; margin-top: 3px; }
  .rm-detail { font-size: 15px; line-height: 1.4; color: var(--text-2); margin-top: 4px; }
  .rm-action { margin-top: 11px; height: 44px; border-radius: 15px; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; font-weight: 700; box-shadow: var(--sh-sm); transition: transform .12s ease; }
  .rm-action svg { width: 17px; height: 17px; }
  .result:active .rm-action { background: var(--accent-press); transform: scale(.97); }

  /* ---------- Follow-up chips ---------- */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .chip { min-height: 44px; display: inline-flex; align-items: center; background: var(--surface); border: 0; box-shadow: var(--sh-sm); border-radius: 999px; padding: 10px 16px; font: inherit; font-size: 14px; font-weight: 500; color: var(--text-1); cursor: pointer; transition: transform .12s ease, opacity .2s ease; }
  .chip:active { transform: scale(.93); }
  .chip.used { opacity: .38; pointer-events: none; }

  /* ---------- Composer (raised accessory) ---------- */
  .composer { flex: 0 0 auto; margin: 4px 12px 6px; background: var(--surface); border-radius: 28px; box-shadow: var(--sh-raised); display: flex; align-items: center; padding: 6px; min-height: 56px; }
  .cbtn { width: 44px; height: 44px; flex: 0 0 auto; border-radius: 50%; border: 0; background: transparent; color: var(--text-2); display: grid; place-items: center; cursor: pointer; transition: transform .12s ease, background .15s ease, color .15s ease; position: relative; }
  .cbtn:active { transform: scale(.85); }
  .cbtn svg { width: 21px; height: 21px; }
  .cinput { flex: 1 1 auto; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 15px; color: var(--text-1); padding: 10px 4px; outline: none; }
  .cinput::placeholder { color: var(--text-2); }
  .send { background: var(--accent); color: var(--on-accent); box-shadow: var(--sh-sm); }
  .send:active { background: var(--accent-press); }
  .send[disabled] { opacity: .45; }
  .mic.on { color: var(--work-fg); background: var(--work-bg); }
  .bars { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; gap: 2.5px; }
  .bars i { width: 3px; height: 7px; border-radius: 2px; background: currentColor; animation: eq .9s ease-in-out infinite; }
  .bars i:nth-child(2) { animation-delay: .18s; }
  .bars i:nth-child(3) { animation-delay: .36s; }
  @keyframes eq { 0%, 100% { transform: scaleY(.55); } 50% { transform: scaleY(1.7); } }

  /* ---------- Tab bar with sliding tactile capsule ---------- */
  .tabbar { flex: 0 0 auto; margin: 6px 12px 12px; height: 66px; background: var(--surface); border-radius: 26px; box-shadow: var(--sh-raised); position: relative; display: flex; padding: 6px; }
  .tabpill { position: absolute; top: 6px; bottom: 6px; left: 6px; width: calc((100% - 12px) / 3); border-radius: 20px; background: var(--accent); box-shadow: var(--sh-sm); transition: transform .34s var(--spring); }
  .tab { flex: 1 1 0; position: relative; z-index: 1; border: 0; background: transparent; font: inherit; color: var(--text-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; border-radius: 20px; transition: transform .12s ease, color .18s ease; }
  .tab:active { transform: scale(.88); }
  .tab svg { width: 23px; height: 23px; }
  .tab span { font-size: 12px; font-weight: 600; }
  .tab.on { color: var(--on-accent); }

  /* ---------- Tasks screen ---------- */
  .thead { flex: 0 0 auto; padding: 16px 18px 4px; }
  .thead h2 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.02em; }
  .thead p { margin: 3px 0 0; font-size: 13px; color: var(--text-2); }
  .tlist { flex: 1 1 auto; overflow-y: auto; padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .task { background: var(--surface); border-radius: 20px; box-shadow: var(--sh-sm); padding: 14px; display: flex; gap: 12px; align-items: flex-start; }
  .ticon { width: 38px; height: 38px; flex: 0 0 auto; border-radius: 13px; background: var(--work-bg); color: var(--work-fg); display: grid; place-items: center; }
  .ticon svg { width: 19px; height: 19px; }
  .tbody { flex: 1 1 auto; min-width: 0; }
  .tbody b { display: block; font-size: 15px; font-weight: 600; line-height: 1.35; }
  .tsrc { font-size: 13px; color: var(--text-2); margin-top: 3px; }
  .tstatus { margin-left: auto; flex: 0 0 auto; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--text-2); padding-top: 2px; }
  .tstatus svg { width: 14px; height: 14px; }
  .tstatus.ready { background: var(--accent); color: var(--on-accent); padding: 5px 10px; border-radius: 999px; margin-top: 0; box-shadow: var(--sh-sm); }

  /* ---------- Me screen ---------- */
  .mehead { flex: 0 0 auto; padding: 16px 18px 4px; }

  .pname { font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
  .psub { font-size: 14px; color: var(--text-2); margin-top: 2px; }
  .group { margin: 12px 14px 0; background: var(--surface); border-radius: 20px; box-shadow: var(--sh-sm); overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 14px; min-height: 52px; border: 0; background: transparent; font: inherit; font-size: 15px; color: var(--text-1); text-align: left; cursor: pointer; transition: background .12s ease; }
  .row:active { background: var(--inset); }
  .ric { width: 32px; height: 32px; flex: 0 0 auto; border-radius: 10px; background: var(--inset); color: var(--text-2); display: grid; place-items: center; }
  .ric svg { width: 17px; height: 17px; }
  .row .chev { margin-left: auto; color: var(--text-2); width: 17px; height: 17px; }
  .mefoot { text-align: center; font-size: 12px; color: var(--text-2); padding: 16px 24px 18px; }

  /* ---------- Plan sheet ---------- */
  .scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .3s ease; z-index: 40; border: 0; cursor: pointer; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 28px 28px 0 0; transform: translateY(104%); transition: transform .38s var(--spring); z-index: 41; max-height: 84%; display: flex; flex-direction: column; box-shadow: 0 -12px 40px rgba(0,0,0,.18); }
  .app.sheet-open .scrim { opacity: 1; pointer-events: auto; }
  .app.sheet-open .sheet { transform: translateY(0); }
  .sheet-handle { flex: 0 0 auto; width: 100%; height: 44px; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--text-2); }
  .sheet-handle svg { width: 20px; height: 20px; }
  .sheet-close { position: absolute; top: 10px; right: 12px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--inset); color: var(--text-2); display: grid; place-items: center; cursor: pointer; transition: transform .12s ease; z-index: 2; }
  .sheet-close:active { transform: scale(.86); }
  .sheet-close svg { width: 19px; height: 19px; }
  .sheet-body { overflow-y: auto; padding: 2px 18px 30px; }
  .sheet-title { font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
  .sheet-sub { font-size: 15px; line-height: 1.45; color: var(--text-2); margin-top: 5px; }
  .daylabel { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--accent-deep); margin-top: 18px; }
  .rowi { display: flex; align-items: flex-start; gap: 10px; padding: 11px 0 1px; }
  .rowi > svg { width: 17px; height: 17px; color: var(--accent-deep); flex: 0 0 auto; margin-top: 2px; }
  .rowi .grow { flex: 1 1 auto; min-width: 0; }
  .rowi b { display: block; font-size: 15px; font-weight: 600; }
  .rowi .note { display: block; font-size: 13px; color: var(--text-2); margin-top: 2px; }
  .rowi .when { margin-left: auto; flex: 0 0 auto; font-size: 13px; color: var(--text-2); padding-top: 2px; white-space: nowrap; }
  .sheetfoot { margin-top: 16px; display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; color: var(--text-2); background: var(--inset); border-radius: 12px; padding: 10px 12px; }
  .sheetfoot svg { width: 15px; height: 15px; flex: 0 0 auto; color: var(--accent-deep); }

  /* ---------- Local feedback toast ---------- */
  .toast { position: absolute; left: 50%; bottom: 150px; transform: translate(-50%, 8px); background: var(--toast-bg); color: var(--toast-fg); font-size: 13px; font-weight: 500; padding: 9px 14px; border-radius: 999px; box-shadow: var(--sh-md); white-space: nowrap; max-width: 86%; overflow: hidden; text-overflow: ellipsis; opacity: 0; pointer-events: none; transition: opacity .22s ease, transform .22s ease; z-index: 50; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Focus and reduced motion ---------- */
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
  .chip:focus-visible, .tab:focus-visible, .cbtn:focus-visible, .iconbtn:focus-visible, .send:focus-visible { outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>

<script>
"use strict";

  "ellipsis": ["M6.75 12a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0ZM12.75 12a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0ZM18.75 12a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z"],

};

function icon(name) {
  var paths = ICONS[name].map(function (d) { return '<path d="' + d + '"></path>'; }).join("");
  return '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths + '</svg>';
}

/* ---------- Sample content (verbatim from design-spec.md shared sample content) ---------- */
var USER_REQUEST = "I want a relaxed two-day trip to Hangzhou this weekend. Tea houses, walking, and no early starts.";
var ASSISTANT_ANSWER = "I would keep Saturday around West Lake and save Longjing for Sunday. Here is a calm plan with late starts and time to stop for tea.";
var WORK_SUMMARY = "I compared tea houses and kept the route compact.";
var RESULT_TITLE = "A slower weekend";
var RESULT_DETAIL = "West Lake on Saturday, Longjing on Sunday. No alarms required.";
var CHIPS = ["Make it food-focused", "Add a museum", "Save as a task"];
var PLAN_DAYS = [
  { label: "Saturday", rows: [
    { place: "West Lake", note: "Walk the east shore, stop for tea", when: "Late morning" },
    { place: "Tea house", note: "One pot of Longjing by the water", when: "Afternoon" }
  ]},
  { label: "Sunday", rows: [
    { place: "Longjing village", note: "Stroll the tea fields", when: "Late morning" },
    { place: "Village tea house", note: "Taste, then take some home", when: "Afternoon" }
  ]}
];

/* ---------- State ---------- */
var state = {
  appear: "light",
  tab: "chat",
  sheet: false,
  listening: false,
  messages: [{ who: "user", text: USER_REQUEST }],
  usedChips: {},
  tasks: [
    { title: WORK_SUMMARY, src: "Twin Bot, Weekend in Hangzhou", status: "done" }
  ],
  draft: ""
};

/* ---------- Frame: exact DOM from ios_frame.jsx (width 393, height 852, 9:41, battery 100) ---------- */
function buildFrame() {
  var host = document.getElementById("frame-host");
  host.innerHTML =
    '<div class="frame-wrapper">' +
      '<div class="frame-screen" style="width:393px;height:852px;">' +
        '<div class="frame-status">' +
          '<span>9:41</span>' +
          '<div class="frame-status-icons">' +
            '<div class="frame-signal"><i style="height:4px"></i><i style="height:6px"></i><i style="height:9px"></i><i style="height:11px"></i></div>' +
            '<svg width="16" height="12" viewBox="0 0 16 12" fill="none" style="color:currentColor">' +
              '<path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor"></path>' +
              '<path d="M3 7.5a7 7 0 0110 0" stroke="currentColor" strokeWidth="1.3" fill="none" stroke-linecap="round"></path>' +
              '<path d="M1 4.5a11 11 0 0114 0" stroke="currentColor" strokeWidth="1.3" fill="none" stroke-linecap="round" opacity="0.7"></path>' +
            '</svg>' +
            '<div class="frame-battery"><i style="width:100%"></i><b></b></div>' +
          '</div>' +
        '</div>' +
        '<div class="frame-island"></div>' +
        '<div class="frame-content"><div class="app" id="app"></div></div>' +
        '<div class="frame-home"></div>' +
      '</div>' +
    '</div>';
}
/* strokeWidth -> stroke-width for valid inline SVG attribute */
function fixSvgAttrs() {
  document.querySelectorAll('#frame-host svg [strokeWidth]').forEach(function (n) {
    n.setAttribute('stroke-width', n.getAttribute('strokeWidth'));
    n.removeAttribute('strokeWidth');
  });
}

/* ---------- App skeleton ---------- */
function buildApp() {
  var app = document.getElementById("app");
  app.innerHTML =
    '<div class="viewport">' +
      '<section class="screen active" data-screen="chat" aria-label="Chat">' +
        '<header class="mhead">' +
          '<div class="mavatar" role="img" aria-label="Twin Bot avatar"></div>' +
          '<div class="mht"><b>Weekend in Hangzhou</b><span>Twin Bot</span></div>' +
          '<button class="iconbtn" type="button" aria-label="Conversation options" data-feedback="Conversation options live in the app shell.">' + icon("ellipsis") + '</button>' +
        '</header>' +
        '<div class="transcript" id="transcript" aria-live="polite"></div>' +
      '</section>' +
      '<section class="screen" data-screen="tasks" aria-label="Tasks">' +
        '<header class="thead"><h2>Tasks</h2><p>Saved from your conversations</p></header>' +
        '<div class="tlist" id="tlist"></div>' +
      '</section>' +
      '<section class="screen" data-screen="me" aria-label="Me">' +
        '<header class="mehead"><h2>Me</h2></header>' +
        '<div class="profile">' +
          '<div class="pava" role="img" aria-label="IDBots profile"></div>' +
          '<div><div class="pname">IDBots</div><div class="psub">Local-first companion</div></div>' +
        '</div>' +
        '<div class="group">' +
          '<button class="row" type="button" data-feedback="Settings opens in the app shell."><span class="ric">' + icon("cog") + '</span>Settings<span class="chev">' + icon("chevron-right") + '</span></button>' +
          '<button class="row" type="button" data-feedback="Notification settings open in the app shell."><span class="ric">' + icon("bell") + '</span>Notifications<span class="chev">' + icon("chevron-right") + '</span></button>' +
          '<button class="row" type="button" data-feedback="Wallet opens in the app shell."><span class="ric">' + icon("wallet") + '</span>Wallet<span class="chev">' + icon("chevron-right") + '</span></button>' +
        '</div>' +
        '<div class="mefoot">Conversations and tasks stay on this device.</div>' +
      '</section>' +
    '</div>' +
    '<div class="toast" id="toast" role="status"></div>' +
    '<form class="composer" id="composer">' +
      '<button class="cbtn" type="button" aria-label="Add attachment" id="attachBtn">' + icon("paper-clip") + '</button>' +
      '<input class="cinput" id="cinput" type="text" placeholder="Message Twin" autocomplete="off" aria-label="Message Twin">' +
      '<button class="cbtn mic" type="button" aria-label="Voice input" id="micBtn" aria-pressed="false">' + icon("microphone") + '<span class="bars" aria-hidden="true"><i></i><i></i><i></i></span></button>' +
      '<button class="cbtn send" type="submit" aria-label="Send message" id="sendBtn" disabled>' + icon("paper-airplane") + '</button>' +
    '</form>' +
    '<nav class="tabbar" aria-label="Main navigation">' +
      '<div class="tabpill" id="tabpill"></div>' +
      '<button class="tab on" type="button" role="tab" aria-selected="true" data-tab="0">' + icon("chat") + '<span>Chat</span></button>' +
      '<button class="tab" type="button" role="tab" aria-selected="false" data-tab="1">' + icon("tasks") + '<span>Tasks</span></button>' +
      '<button class="tab" type="button" role="tab" aria-selected="false" data-tab="2">' + icon("user") + '<span>Me</span></button>' +
    '</nav>' +
    '<button class="scrim" type="button" aria-label="Close plan" id="scrim"></button>' +
    '<div class="sheet" role="dialog" aria-modal="true" aria-label="Plan detail" id="sheet">' +
      '<button class="sheet-handle" type="button" aria-label="Close plan" id="sheetHandle">' + icon("chevron-down") + '</button>' +
      '<button class="sheet-close" type="button" aria-label="Close plan" id="sheetClose">' + icon("x-mark") + '</button>' +
      '<div class="sheet-body">' +
        '<div class="sheet-title">' + RESULT_TITLE + '</div>' +
        '<div class="sheet-sub">' + RESULT_DETAIL + '</div>' +
        PLAN_DAYS.map(function (day) {
          return '<div class="daylabel">' + day.label + '</div>' + day.rows.map(function (r) {
            return '<div class="rowi">' + icon("map-pin") + '<div class="grow"><b>' + r.place + '</b><span class="note">' + r.note + '</span></div><span class="when">' + r.when + '</span></div>';
          }).join("");
        }).join("") +
        '<div class="sheetfoot">' + icon("clock") + 'No alarms required</div>' +
      '</div>' +
    '</div>';
}

/* ---------- Renderers ---------- */
function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderTranscript(scrollToBottom) {
  var t = document.getElementById("transcript");
  var html = '<div class="daypill">Today</div>';
  state.messages.forEach(function (m) {
    if (m.who === "user") {
      html += '<div class="msgrow"><div class="bubble-user">' + esc(m.text) + '</div></div>';
    }
  });
  html +=
    '<div class="agroup">' +
      '<div class="atext">' + ASSISTANT_ANSWER + '</div>' +
      '<div class="workpill">' + icon("check-circle") + '<span>' + WORK_SUMMARY + '</span></div>' +
    '</div>' +
    '<button class="result" type="button" id="resultBtn" aria-label="View plan: ' + RESULT_TITLE + '">' +
      '<span class="stud" aria-hidden="true"><i></i></span>' +
      '<div class="rm-eyebrow">Your plan</div>' +
      '<div class="rm-title">' + RESULT_TITLE + '</div>' +
      '<div class="rm-detail">' + RESULT_DETAIL + '</div>' +
      '<div class="rm-action">View plan' + icon("chevron-right") + '</div>' +
    '</button>' +
    '<div class="chips">' + CHIPS.map(function (c) {
      var used = state.usedChips[c] ? " used" : "";
      return '<button class="chip' + used + '" type="button" data-chip="' + c + '">' + c + '</button>';
    }).join("") + '</div>';
  t.innerHTML = html;
  if (scrollToBottom) t.scrollTop = t.scrollHeight;
}

function renderTasks() {
  var list = document.getElementById("tlist");
  list.innerHTML = state.tasks.map(function (task) {
    var status = task.status === "done"
      ? '<span class="tstatus">' + icon("check-circle") + 'Done</span>'
      : '<span class="tstatus ready">Ready</span>';
    return '<div class="task"><span class="ticon">' + icon("tasks") + '</span><div class="tbody"><b>' + task.title + '</b><div class="tsrc">' + task.src + '</div></div>' + status + '</div>';
  }).join("");
}

function updateTabs() {
  var idx = { chat: 0, tasks: 1, me: 2 }[state.tab];
  document.querySelectorAll(".screen").forEach(function (s) {
    var sIdx = { chat: 0, tasks: 1, me: 2 }[s.getAttribute("data-screen")];
    s.classList.toggle("active", sIdx === idx);
    s.classList.toggle("off-left", sIdx < idx);
    s.classList.toggle("off-right", sIdx > idx);
  });
  document.getElementById("tabpill").style.transform = "translateX(" + (idx * 100) + "%)";
  document.querySelectorAll(".tab").forEach(function (tb) {
    var on = Number(tb.getAttribute("data-tab")) === idx;
    tb.classList.toggle("on", on);
    tb.setAttribute("aria-selected", on ? "true" : "false");
  });
}

function updateSheet() {
  document.getElementById("app").classList.toggle("sheet-open", state.sheet);
}

function updateMic() {
  var mic = document.getElementById("micBtn");
  mic.classList.toggle("on", state.listening);
  mic.setAttribute("aria-pressed", state.listening ? "true" : "false");
  mic.querySelector("svg").style.display = state.listening ? "none" : "";
  mic.querySelector(".bars").style.display = state.listening ? "flex" : "none";
}

var toastTimer = null;
function toast(msg) {
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove("show"); }, 1900);
}

/* ---------- Events ---------- */
function bind() {
  document.querySelectorAll(".tab").forEach(function (tb) {
    tb.addEventListener("click", function () {
      state.tab = ["chat", "tasks", "me"][Number(tb.getAttribute("data-tab"))];
      updateTabs();
    });
  });

  document.querySelectorAll(".seg").forEach(function (seg) {
    seg.addEventListener("click", function () {
      state.appear = seg.getAttribute("data-appear");
      document.documentElement.setAttribute("data-appear", state.appear);
      document.querySelectorAll(".seg").forEach(function (s) { s.classList.toggle("on", s === seg); });
    });
  });

  var transcript = document.getElementById("transcript");
  transcript.addEventListener("click", function (e) {
    var chip = e.target.closest(".chip");
    if (chip) {
      var label = chip.getAttribute("data-chip");
      state.usedChips[label] = true;
      state.messages.push({ who: "user", text: label });
      if (label === "Save as a task") {
        state.tasks.push({ title: RESULT_TITLE, src: "Saved from Weekend in Hangzhou", status: "ready" });
        renderTasks();
        toast("Saved to Tasks.");
      }
      renderTranscript(true);
      return;
    }
    if (e.target.closest(".result")) {
      state.sheet = true;
      updateSheet();
    }
  });

  document.getElementById("scrim").addEventListener("click", function () { state.sheet = false; updateSheet(); });
  document.getElementById("sheetClose").addEventListener("click", function () { state.sheet = false; updateSheet(); });
  document.getElementById("sheetHandle").addEventListener("click", function () { state.sheet = false; updateSheet(); });

  var input = document.getElementById("cinput");
  var send = document.getElementById("sendBtn");
  input.addEventListener("input", function () {
    state.draft = input.value;
    send.disabled = !state.draft.trim();
  });
  document.getElementById("composer").addEventListener("submit", function (e) {
    e.preventDefault();
    var text = state.draft.trim();
    if (!text) return;
    state.messages.push({ who: "user", text: text });
    state.draft = "";
    input.value = "";
    send.disabled = true;
    renderTranscript(true);
  });

  document.getElementById("attachBtn").addEventListener("click", function () {
    toast("File picker opens in the app shell.");
  });
  document.getElementById("micBtn").addEventListener("click", function () {
    state.listening = !state.listening;
    updateMic();
    toast(state.listening ? "Listening locally. Tap again to stop." : "Voice entry cancelled.");
  });

  document.querySelectorAll("[data-feedback]").forEach(function (btn) {
    btn.addEventListener("click", function () { toast(btn.getAttribute("data-feedback")); });
  });
}

/* ---------- Init ---------- */
buildFrame();
buildApp();
fixSvgAttrs();
bind();
renderTranscript(false);
renderTasks();
updateTabs();
updateSheet();
updateMic();
</script>
</body>
</html>
