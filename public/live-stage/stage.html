<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Stage</title>
  <style>__STAGE_CSS__</style>
</head>
<body data-enabled="true" data-orb-backend="loading">
  <div class="stage-off"><div><strong data-stage-off-title>Live stage is off</strong><span data-stage-off-body>The text conversation and final projector remain available.</span></div></div>
  <main class="live-stage" aria-live="polite">
    <div class="core-aurora"></div>
    <canvas class="core-canvas" data-place-canvas aria-hidden="true"></canvas>
    <canvas class="companion-back" data-companion-back aria-hidden="true"></canvas>
    <div class="core-topline"><div class="core-presence"><img data-avatar src="__AVATAR_DATA_URI__" alt="" /><span data-bot-name>Twin presence</span></div><span class="core-family" data-core-family>Received</span></div>
    <div class="core-entity"><div class="membrane-wrap"><div class="membrane"><img class="core-avatar" data-avatar src="__AVATAR_DATA_URI__" alt="Current bot avatar" /></div><div class="orb-halo" aria-hidden="true"></div><div class="core-voice" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></div></div>
    <canvas class="companion-front" data-companion-front aria-hidden="true"></canvas>
    <div class="group-members" data-group-members aria-hidden="true"></div>
    <section class="core-copy"><div class="core-kicker" data-core-verb>Received<span class="core-elapsed" data-core-elapsed hidden></span></div><h1 data-core-title></h1><p data-core-caption></p></section>
    <div class="companion-rail" data-companion-rail></div>
    <div class="transient-chip" data-transient-chip hidden></div>
    <aside class="task-hud" data-task-hud hidden></aside>
    <div class="core-participants" data-core-participants></div>
    <div class="core-footnote" data-director-metrics></div>
    <button class="core-report-ready" type="button" data-report-open disabled><span data-report-ready-text>Report ready</span><span data-report-open-label>Opening the final page</span></button>
    <section class="interaction-card" data-interaction-card hidden></section>
  </main>
  <script>window.__INITIAL_LIVE_STAGE__=__INITIAL_STATE__;window.__FALLBACK_AVATAR__=__FALLBACK_AVATAR_DATA_URI__;</script>
  <script>__ORB_EFFECT__</script>
  <script>__ORB_RENDERER__</script>
  <script>__STAGE_SCENES_JS__</script>
  <script>__STAGE_JS__</script>
</body>
</html>
