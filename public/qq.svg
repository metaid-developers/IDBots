  <path d="M45.4 32.8c2.4 3.4 5.6 7.8 7.3 11.4.9 2-.2 3.1-2 1.7-2.9-2.3-5.4-6.5-7.2-10.3-.7-1.5-.5-2.9.3-3.9z" fill="#0B1016"/>

