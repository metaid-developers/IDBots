<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="QQ">
  <defs>
    <linearGradient id="qq-badge" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8ECF1"/>
    </linearGradient>
    <linearGradient id="qq-body" x1="0.25" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#2B3542"/>
      <stop offset="0.4" stop-color="#161D26"/>
      <stop offset="1" stop-color="#080C11"/>
    </linearGradient>
    <linearGradient id="qq-belly" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDF1F5"/>
    </linearGradient>
    <linearGradient id="qq-beak" x1="0.3" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFC93F"/>
      <stop offset="1" stop-color="#F2960A"/>
    </linearGradient>
    <linearGradient id="qq-scarf" x1="0.1" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#F4463B"/>
      <stop offset="0.55" stop-color="#E3322A"/>
      <stop offset="1" stop-color="#CE241F"/>
    </linearGradient>
    <linearGradient id="qq-tail" x1="0" y1="0" x2="0.8" y2="0.3">
      <stop offset="0" stop-color="#FF4E41"/>
      <stop offset="1" stop-color="#C01D19"/>
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#qq-badge)" stroke="#DCE1E7" stroke-width="1"/>
  <ellipse cx="32" cy="58.4" rx="12.6" ry="1.9" fill="#0B0F14" opacity="0.09"/>

