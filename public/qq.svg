  <path d="M15.4 34.6c5.4 1.1 11.4 1.7 16.6 1.7s11.2-.6 16.6-1.7" fill="none" stroke="#9C1713" stroke-width="1.1" opacity="0.34"/>
  <path d="M14.6 32.2c1.4.9 2.8 1.5 4.2 1.9" fill="none" stroke="#FF7A6D" stroke-width="0.9" opacity="0.4" stroke-linecap="round"/>
