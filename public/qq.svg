  <path d="M27.9 34.2v10" stroke="#A51814" stroke-width="0.9" opacity="0.4"/>
  <path d="M22.6 33.6c.2 2.1.9 3.7 2.2 4.7" fill="none" stroke="#8E1512" stroke-width="0.9" opacity="0.3" stroke-linecap="round"/>

