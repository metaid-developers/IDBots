<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NFT 橱窗</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="shop-shell">
    <header id="shop-header" class="shop-header">
      <div class="header-main">
        <div class="owner-identity">
          <div class="avatar-wrap">
            <img id="owner-avatar" class="owner-avatar" alt="" hidden />
            <span id="owner-avatar-fallback" class="owner-avatar owner-avatar-fallback" aria-hidden="true">N</span>
            <span id="owner-presence" class="presence-dot presence-unknown" title=""></span>
          </div>
          <div class="owner-meta">
            <div class="title-row">
              <h1 id="shop-title" class="shop-title">NFT 橱窗</h1>
            </div>
            <div class="owner-subrow">
              <span id="owner-name" class="owner-name">…</span>
              <span class="meta-sep" aria-hidden="true">·</span>
              <button id="owner-id" class="owner-id mono" type="button" title=""></button>
            </div>
            <p id="shop-slogan" class="shop-slogan" hidden></p>
          </div>
        </div>

        <div class="header-controls">
          <button id="btn-message" class="btn btn-ghost" type="button"></button>
          <button id="btn-add-friend" class="btn btn-secondary" type="button"></button>
          <button id="btn-lang" class="btn btn-lang" type="button">EN</button>
        </div>
      </div>

      <!-- Hidden permanently on storefront so visitors and owners alike see a clean gallery -->
      <div id="owner-bar" class="owner-bar" hidden aria-hidden="true">
        <button id="btn-promo-pack" class="btn btn-accent" type="button"><span data-i18n="ownerPromoPack"></span></button>
        <span class="owner-bar-hint" data-i18n="ownerBarHint"></span>
      </div>
    </header>

    <nav class="tabs-bar" role="tablist">
      <button id="tab-listings" class="tab active" role="tab" aria-selected="true" type="button">
        <span id="tab-listings-label"></span>
        <span id="tab-listings-count" class="tab-count">0</span>
      </button>
      <button id="tab-holdings" class="tab" role="tab" aria-selected="false" type="button">
        <span id="tab-holdings-label"></span>
        <span id="tab-holdings-count" class="tab-count">0</span>
      </button>
    </nav>

    <main id="shop-main" class="shop-main">
      <section id="panel-listings" class="panel">
        <div id="listings-grid" class="grid"></div>
      </section>
      <section id="panel-holdings" class="panel" hidden>
        <div id="holdings-grid" class="grid"></div>
      </section>
      <div id="empty-state" class="empty" hidden></div>
    </main>

    <footer class="shop-footer">
      <span data-i18n="footerNote"></span>
    </footer>
  </div>

  <!-- External-browser fallback guide modal -->
  <div id="guide-mask" class="modal-mask" hidden></div>
  <div id="guide-card" class="guide-card" role="dialog" aria-modal="true" hidden>
    <button id="guide-close" class="modal-close" type="button" aria-label="close">✕</button>
    <h3 data-i18n="guideTitle"></h3>
    <p data-i18n="guideBody"></p>
    <div class="guide-snippet">
      <code id="guide-command" class="mono"></code>
    </div>
    <div class="guide-row">
      <button id="guide-copy" class="btn btn-accent" type="button"></button>
    </div>
    <p class="guide-download" data-i18n="guideDownload"></p>
  </div>

  <script src="./app.js"></script>
</body>
</html>
