# CR-WSA-006 pilot — companion to idbots-zram-swap.service.
#
# The file name must sort AFTER the cloud image's 99-apsara-sysctl.conf, which
# sets vm.swappiness = 0; sysctl.d applies files in lexical order.
#
# swappiness above 100 makes reclaim prefer compressing cold anonymous pages
# into zram over dropping page-cache pages (the kernel documents values above
# 100 for in-memory swap). page-cluster = 0 disables swap readahead: zram
# faults are random and cheap, readahead only costs CPU.
vm.swappiness = 150
vm.page-cluster = 0
