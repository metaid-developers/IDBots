<title>IDBots — Direction B: Companion</title>
<!--
  Direction B — Companion
  Reference: Duolingo official brand identity, verified 2026-11-20 at
  https://design.duolingo.com/brand/color and https://design.duolingo.com/marketing/elements
  (client-rendered; principle confirmation via https://paletadecolores.org/en/brands/duolingo.html).
  Broad principles migrated only: (1) the brand color is taken confidently from the mascot itself
  and fills the field (Feather Green -> Launch Amber #FEB338, which is also the artwork's own
  background, so the square's edges dissolve and the robot appears to live directly on the splash);
  (2) the mascot is the single hero at friendly, starring scale, uncropped and unstretched;
  (3) one clear, bold, rounded wordmark as the brand signature; (4) mascot-on-field restraint —
  supporting geometry stays soft and secondary so it never competes with the robot.
  Form-from-robot sentence: the composition is built from the robot's own square pixel grid and
  stacked head-and-body geometry — a warm cream icon-tile lifts the robot like the home-screen
  icon you just tapped, while the loading rhythm and floating accents are nothing but discrete
  amber, cream, and orange pixel squares sampled straight from the artwork.
-->
<style>
  :root {
    --amber: #FEB338;
    --cream: #FFDBA0;
    --orange: #F46A21;
    --charcoal: #303133;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #EAE4D8;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: "Arial Rounded MT Bold", "Helvetica Rounded", "SF Pro Rounded", ui-rounded, system-ui, sans-serif;
  }
  .stage {
    position: relative;
    width: 390px;
    height: 844px;
    background: var(--amber);
    overflow: hidden;
    flex: 0 0 auto;
  }
  /* cream mat: the home-screen icon gently lifted, robot square dissolves into it */
  .tile {
    position: absolute;
    left: 47px;
    top: 154px;
    width: 296px;
    height: 296px;
    border-radius: 72px;
    background: var(--cream);
  }
  .robot {
    position: absolute;
    left: 63px;
    top: 170px;
    width: 264px;
    height: 264px;
    object-fit: contain;
  }
  .wordmark {
    position: absolute;
    top: 486px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 46px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--charcoal);
  }
  .tagline {
    position: absolute;
    top: 550px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.3px;
    color: rgba(48, 49, 51, 0.82);
  }
  /* static pixel-square loading rhythm, sampled from the artwork's palette */
  .loader {
    position: absolute;
    top: 748px;
    left: 164px;
    width: 62px;
    height: 10px;
  }
  .loader span {
    position: absolute;
    top: 0;
    width: 10px;
    height: 10px;
  }
  .loader span:nth-child(1) { left: 0; background: var(--cream); opacity: 0.55; }
  .loader span:nth-child(2) { left: 26px; background: var(--cream); opacity: 0.8; }
  .loader span:nth-child(3) { left: 52px; background: var(--orange); opacity: 1; }
  /* floating pixel accents — discrete squares, echoing the robot's pixel grid */
  .px { position: absolute; }
  .px1 { left: 40px;  top: 108px; width: 10px; height: 10px; background: var(--cream);  opacity: 0.9; }
  .px2 { left: 332px; top: 88px;  width: 8px;  height: 8px;  background: var(--orange); opacity: 0.85; }
  .px3 { left: 356px; top: 470px; width: 8px;  height: 8px;  background: var(--cream);  opacity: 0.6; }
  .px4 { left: 44px;  top: 512px; width: 8px;  height: 8px;  background: var(--charcoal); opacity: 0.28; }
  .px5 { left: 318px; top: 596px; width: 6px;  height: 6px;  background: var(--orange); opacity: 0.5; }
  .px6 { left: 302px; top: 136px; width: 6px;  height: 6px;  background: var(--cream);  opacity: 0.7; }
</style>
