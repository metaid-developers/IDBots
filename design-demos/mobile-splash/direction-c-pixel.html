<!DOCTYPE html>
<!--
  IDBots mobile splash — Direction C: pixel-native (Susan Kare philosophy).
  Reference/logic: Susan Kare's early Macintosh icon work — economical pixels,
  strong silhouettes, wit, and immediate recognition. A charcoal field is the
  "empty bitmap" on which the robot's own vocabulary (amber pixels, cream face,
  square eyes/mouth, head-body stacking) becomes the whole composition.
  Form-from-robot sentence: every element on this screen — the 5x7 pixel
  wordmark, the amber pixel cascade, the registration marks, and the loading
  face — is built from the same square pixels and the same stacked
  head/eye/mouth geometry that make up the robot, so the layout reads as the
  robot's bitmap extended into the launch screen.
-->

  /* The 390 x 844 launch surface */
