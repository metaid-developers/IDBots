# IDBots DSH runtime — M1 test composition.
#
# Development/test shape: core services + JSONL persistence + fake LLM fixture
# + our SDK server with the session/steer & session/cancel wire extensions.
# The production composition (provider routes from the app's provider table,
# idbots-permissions, idbots-prompt-sections, idbots-tools) is generated by the
# Electron main process in M3+; stdout belongs to the JSON-RPC protocol.

- id: sessions
  name: '@deepseek-ai/dsh-session'

- id: tools
  name: '@deepseek-ai/dsh-tools'

# 0.2.2: tool execution lives in an executor plugin (the registry alone no
# longer executes batches). Native executor, no config fields, unscoped =
# deployment default for every agent scope.
- id: tool-executor
  name: '@deepseek-ai/dsh-tool-executor-native'

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    includeHarnessIdentity: false

- id: agent
  name: '@deepseek-ai/dsh-agent'

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'

# Projection registry plugin (0.1.2+: official package apply). agent-loop
# (turnBoundary fold) and token-meter (usage units) hard-require the
# ctx.sessionProjections service.
- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.test-sessions'
    compression: 'none'

- id: checkpoint-policy
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: fake-llm
  name: './test/fixtures/fake-llm.mjs'

- id: idbots-test-tools
  name: './test/fixtures/test-tools.mjs'

# Owns the `approval` seam: audit events (approval/asked + approval/decided in
# the session feed), the answerer waterfall, and fail-closed semantics.
# idbots-sdk-server registers the answerer that bridges asks to the wire.
- id: user-approval
  name: '@deepseek-ai/dsh-user-approval'

- id: idbots-sdk-server
  name: './plugins/idbots-sdk-server.mjs'
