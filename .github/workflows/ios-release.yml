name: iOS Release (cloud-signed)

# Manual run: Actions -> iOS Release (cloud-signed) -> Run workflow -> pick branch -> fill version.
# NOTE: workflow_dispatch only becomes clickable once this file exists on the default branch
# (GitHub platform rule). The push trigger below lets the pipeline be exercised from its own
# feature branch before that merge; it is scoped to this branch and to signing-relevant paths.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version for this App Store build (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
  push:
    branches:
      - ci/ios-cloud-build
    paths:
      - '.github/workflows/ios-release.yml'
      - 'mobile-shell/**'

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-15 # free public runner; never a paid larger runner
    timeout-minutes: 90
    env:
      # workflow_dispatch provides inputs.version; a push-run has no inputs, so fall back.
      BUILD_VERSION: ${{ inputs.version || '1.0.0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Activate pnpm (repo pins pnpm@11.24.0)
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm --version

      # 说明：mobile-shell 使用 pnpm-lock.yaml（仓库无 package-lock.json），
      # 因此用 pnpm 安装而不是 npm；与 npm install 等价但严格按锁文件解析。
      - name: Install JS dependencies (mobile-shell)
        working-directory: mobile-shell
        run: pnpm install --frozen-lockfile

      - name: pod install (CocoaPods, App target)
        working-directory: mobile-shell/ios/App
        run: pod install
        env:
          COCOAPODS_DISABLE_STATS: 'true'

      - name: Install Apple distribution certificate into a temp keychain
        # 材料来源：GitHub Secrets。全程不打印任何 secret 内容。
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/dist_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/idbots-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          # 让 codesign 免弹授权框读取私钥
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # 发布签名统一走临时钥匙串（ephemeral runner，用完即焚）
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH="$RUNNER_TEMP/idbots-appstore.mobileprovision"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          UUID=$(security cms -D -i "$PP_PATH" | /usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin)
          echo "Provisioning profile UUID: $UUID"
          cp "$PP_PATH" "$PROFILE_DIR/$UUID.mobileprovision"

      - name: xcodebuild archive (Manual signing, App Store)
        working-directory: mobile-shell/ios/App
        run: |
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=48AW2FB7Y2 \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="IDBots App Store (com.idbots.world)" \
            MARKETING_VERSION="$BUILD_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            | xcbeautify --renderer github-actions

      - name: Export .ipa (app-store-connect method)
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>48AW2FB7Y2</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.idbots.world</key>
              <string>IDBots App Store (com.idbots.world)</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa-export" \
            | xcbeautify --renderer github-actions
          mv "$RUNNER_TEMP/ipa-export"/*.ipa "$RUNNER_TEMP/IDBots-a$GITHUB_RUN_NUMBER.ipa"

      - name: Generate sha256 manifest
        run: |
          cd "$RUNNER_TEMP"
          shasum -a 256 IDBots-*.ipa | tee SHA256SUMS.txt

      - name: Upload .ipa as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: IDBots-ios-ipa-run-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/IDBots-*.ipa
            ${{ runner.temp }}/SHA256SUMS.txt
            ${{ runner.temp }}/App.xcarchive/Products/Applications/App/Info.plist
          retention-days: 10
