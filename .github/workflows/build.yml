name: Build/Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to publish from main (for example v0.6.2)"
        required: false
        type: string

permissions:
  contents: write  # 允许创建 GitHub Release 和上传 Release 附件

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 (Apple Silicon).
          # mac_arch  -> the electron-builder arch flag and APP_ARCH for
          #             scripts/release-artifact-paths.cjs (the DMG file name).
          # mac_dir   -> electron-builder's --dir output directory. It is NOT
          #             derived from the arch: electron-builder treats x64 as
          #             the default arch, so x64 lands in `release/mac` while
          #             arm64 gets the `-arm64` suffix (`getArchSuffix` in
          #             builder-util returns "" for the default arch).
          - os: macos-latest
            build_args: --mac --arm64 --dir
            mac_arch: arm64
            mac_dir: mac-arm64
          # macOS x64 (Intel). Built on a native Intel hosted runner on purpose:
          # pnpm then resolves the darwin-x64 siblings of every optional native
          # package (dsh-runtime carries ~9 darwin-arm64 ones: cua-driver, sharp,
          # ripgrep, sherpa-onnx, koffi, ...). Cross-building --x64 from the arm64
          # runner would embed arm64 binaries into the Intel bundle.
          - os: macos-15-intel
            build_args: --mac --x64 --dir
            mac_arch: x64
            mac_dir: mac
          - os: windows-signer
            build_args: --win --x64
            mac_arch: ""
            mac_dir: ""

    steps:
      # Windows: 必须在 checkout 之前启用长路径，否则 git 操作可能被截断
      - name: Enable Git long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 获取完整历史和所有标签
          # electron-builder 在 publish 时需要访问 git 标签来确定版本和发布信息
          fetch-depth: 0
          submodules: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable

      # The self-hosted win-sign runner has no bash on PATH until the
      # "Setup MinGit (Windows)" step much later in this job, so `shell: bash`
      # dies here with "bash: command not found" (first pnpm-era Windows run,
      # 2026-09-24). Resolve the store path per platform instead (SOP 11.10).
      - name: Get pnpm store directory (Windows)
        if: runner.os == 'Windows'
        id: pnpm-store-win
        shell: powershell
        run: |
          # The runner executes PowerShell steps with $ErrorActionPreference='Stop',
          # which turns ANY native-command stderr output into a terminating error.
          # Corepack's first-run banner ("Corepack is about to download pnpm@...")
          # goes to stderr and killed the first pnpm-era Windows run (2026-09-24).
          # Keep stderr non-fatal and judge success by the parsed value instead.
          $ErrorActionPreference = 'Continue'
          $store = (pnpm store path | Where-Object { $_ -and "$_".Trim() } | Select-Object -Last 1)
          if (-not $store) {
            Write-Error "pnpm store path returned no usable path"
            exit 1
          }
          # AppendAllText writes UTF-8 without a BOM (Out-File/Add-Content differ per PS version).
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "STORE_PATH=$($store.Trim())`n")

      - name: Get pnpm store directory (non-Windows)
        if: runner.os != 'Windows'
        id: pnpm-store-nix
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store-win.outputs.STORE_PATH || steps.pnpm-store-nix.outputs.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'dsh-runtime/pnpm-lock.yaml', 'SKILLs/web-search/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Verify tag matches package version (non-Windows)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os != 'Windows'
        run: |
          node -e 'const tag=process.env.GITHUB_REF_NAME||""; const version=require("./package.json").version; const expected="v"+version; if(tag!==expected){console.error("Tag/package version mismatch: tag="+tag+" package="+version+" expected="+expected); process.exit(1);} console.log("Tag/package version aligned: "+tag);'

      - name: Verify tag matches package version (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        shell: powershell
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "" }
          $packageJson = Get-Content -Raw -Path "package.json" | ConvertFrom-Json
          $version = $packageJson.version
          $expected = "v$version"
          if ($tag -ne $expected) {
            Write-Error ("Tag/package version mismatch: tag={0} package={1} expected={2}" -f $tag, $version, $expected)
            exit 1
          }
          Write-Host ("Tag/package version aligned: {0}" -f $tag)

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install DSH runtime dependencies
        working-directory: dsh-runtime
        run: pnpm install --frozen-lockfile

      # Any reinstall of dsh-runtime/node_modules can wipe the kernel patches
      # the root postinstall applied. Re-apply AFTER the last dsh-runtime
      # install step: without this the packaged app silently ships the
      # unpatched kernel (v0.9.3 regression — the shipped Windows exe still
      # flashed a bash.exe console window while CI stayed green).
      - name: Apply DSH kernel patches
        run: node scripts/apply-dsh-kernel-patches.cjs

      - name: Build renderer (Vite)
        run: pnpm run build

      - name: Compile Electron main process
        run: pnpm run compile:electron

      - name: Run LLM-safe text tests
        run: node --test tests/llmSafeText.test.mjs

      # The long-term task suite guards the first-class board (redesign):
      # the entity store lifecycle, the heartbeat dispatcher, and the
      # longterm.advance escalation rules.
      - name: Run long-term task tests
        run: node --test tests/longTermTaskStore.test.mjs tests/heartbeatService.test.mjs tests/longTermAdvanceService.test.mjs tests/longTermTaskAgentTools.test.mjs

      # Agent-Game-v2 runtime: seat.claimed identity writes, membership
      # bootstrap before the first on-chain write (room 924-2 root cause),
      # local-bot auto-approve fast lane + the RPC bot channel.
      - name: Run agent-game tests
        run: pnpm run test:agent-game

      - name: Validate runtime dependency contracts
        run: |
          node --test tests/runtimeDependencyContract.test.mjs tests/dshRuntimeDepsCheck.test.mjs
          # Depth defense: prove the kernel patches survived every install
          # step above (they live in gitignored node_modules, so nothing else
          # would catch a step that reinstalls dsh-runtime after the apply).
          node scripts/apply-dsh-kernel-patches.cjs --check

      # Behavioral depth defense for the ask_user_question kernel patch:
      # --check proves the bytes applied, this proves the patched tool still
      # forwards per-question detail context across the runtime → host bridge
      # (ask-bridge E2E, mock provider, no network), and the static test pins
      # the patch + prompt contract in source.
      - name: Run dsh ask-context tests
        run: |
          node dsh-runtime/test/ask-bridge.test.mjs
          node --test tests/coworkAskContextPrompt.test.mjs

      # Static source-contract tests for the workspace-instructions line
      # (AGENTS.md/CLAUDE.md injection + git branch chip). Pure file-read +
      # regex assertions: no compile step needed, safe on every matrix OS.
      - name: Run workspace-instructions contract tests
        run: node --test tests/workspaceInstructionsBoundary.test.mjs tests/coworkSessionDetailGitBranch.test.mjs

      # Static source-contract tests for the pinned-skill backstop and the
      # bot-internet composer reuse (pure file-read assertions, no compile).
      - name: Run pinned-skill contract tests
        run: pnpm run test:pinned-skills

      # Behavioral regression suites for the review-round fixes: group-task
      # daemon/staffing/entropy, per-bot skill assignment, cowork proxy.
      # Each script runs compile:electron first (project convention).
      - name: Run group-task / skill-assignment / cowork-proxy regression tests
        run: pnpm run test:release-regressions

      # H-64 leg B: a wake re-drive must be identifiable at the presentation
      # layer — the re-presented row carries the re-served bit plus the
      # original message id, never retroactively, with the wake scheduling
      # semantics unchanged. Pins the disposition contract and the
      # [NO_REPLY] -> wake -> fired -> re-drive flow (the script runs
      # compile:electron first, project convention).
      - name: Run private-chat wake re-drive disposition tests
        run: pnpm run test:private-chat-wake-disposition

      - name: Run memory and team-culture tests
        run: pnpm run test:memory

      # Behavioral regression for the OpenTeam task-close fix (H-79): the
      # task-close pin list is capped so team impressions are never silently
      # dropped. Runs compile:electron first (project convention).
      - name: Run open-team impression tests
        run: pnpm run test:open-team-impression

      - name: Run dream retry classification tests
        run: pnpm run test:dream-retry

      - name: Run MetaWeb agent-tool tests
        run: pnpm run test:metaweb

      # Behavioral regression for the omni_read shaping cap (H-71) and for the
      # over-budget LIST-page contract built on top of it: a truncated read must
      # declare first-N-of-M plus a resume cursor instead of spilling silently,
      # and a list page that still fits whole rows must come back as parseable
      # JSON carrying only whole rows. test:omni-read runs both suites
      # (omniReaderAgentTools + omniReadListTruncation); compile:electron runs
      # first (project convention).
      - name: Run omni-read agent-tool and list-page contract tests
        run: pnpm run test:omni-read

      # Behavioral regression for the gateway-wide JSON object body guard:
      # every POST route must answer a bad body with 400 + contract +
      # error_code instead of hanging the caller or leaking an internal
      # TypeError. Starts the real compiled gateway on a random port; the
      # script runs compile:electron first (project convention).
      - name: Run MetaID RPC body-guard tests
        run: pnpm run test:rpc-body-guard

      - name: Install web-search skill dependencies
        working-directory: SKILLs/web-search
        run: pnpm install --frozen-lockfile

      - name: Build web-search skill
        run: pnpm run build:skill:web-search

      # Windows: 下载捆绑的 PortableGit
      - name: Setup MinGit (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $archiveDir = 'C:\actions-runner\_cache'
          $archivePath = Join-Path $archiveDir 'PortableGit-2.47.1-64-bit.7z.exe'
          $downloadUrl = 'https://github.com/git-for-windows/git/releases/download/v2.47.1.windows.1/PortableGit-2.47.1-64-bit.7z.exe'

          New-Item -Path $archiveDir -ItemType Directory -Force | Out-Null
          $archiveValid = (Test-Path $archivePath) -and ((Get-Item $archivePath).Length -ge 1048576)

          if (-not $archiveValid) {
            Write-Host "PortableGit cache miss. Downloading: $downloadUrl"
            $downloaded = $false
            foreach ($attempt in 1..5) {
              try {
                Invoke-WebRequest -Uri $downloadUrl -OutFile $archivePath -UseBasicParsing -TimeoutSec 300
                if ((Get-Item $archivePath).Length -ge 1048576) {
                  $downloaded = $true
                  break
                }
              } catch {
                Write-Warning ("PortableGit download attempt {0} failed: {1}" -f $attempt, $_.Exception.Message)
              }
              Start-Sleep -Seconds (5 * $attempt)
            }
            if (-not $downloaded) {
              throw "Failed to obtain PortableGit archive for Windows packaging."
            }
          }

          $env:IDBOTS_PORTABLE_GIT_ARCHIVE = $archivePath
          node scripts/setup-mingit.js --required

      # 非 Windows: 创建 mingit 占位目录，避免 electron-builder 报"file source doesn't exist"错误
      - name: Create mingit placeholder (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: mkdir -p resources/mingit

      # ffmpeg is gitignored; electron-builder only warns and skips a missing extraResource.
      - name: Setup bundled ffmpeg
        run: node scripts/setup-ffmpeg.js --required

      # 根据平台启用签名配置（避免 Windows 缺少 bash）
      - name: Configure code signing (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          SECRET_CSC_LINK: ${{ secrets.CSC_LINK }}
          SECRET_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -n "${SECRET_CSC_LINK}" ] && [ -n "${SECRET_CSC_KEY_PASSWORD}" ]; then
            echo "macOS signing certificate is configured. It will be imported into the workflow keychain in the next step."
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi

      - name: Configure code signing (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          SECRET_WIN_CERT_SHA1: ${{ secrets.WIN_CERT_SHA1 }}
        run: |
          if ($env:SECRET_WIN_CERT_SHA1) {
            "CSC_IDENTITY_AUTO_DISCOVERY=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            "CSC_IDENTITY_AUTO_DISCOVERY=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Prepare macOS signing keychain
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo "CSC_LINK/CSC_KEY_PASSWORD not configured for macOS signing." >&2
            exit 1
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/idbots.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT_PATH="$RUNNER_TEMP/idbots-signing.p12"
          printf '%s' "$CSC_LINK" | base64 --decode > "$CERT_PATH" 2>/dev/null || printf '%s' "$CSC_LINK" | base64 -D > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"
          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "CSC_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Build Electron app package (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IDBOTS_SKIP_NOTARIZE: 1
        run: >
          pnpm exec electron-builder ${{ matrix.build_args }}
          --publish never

      - name: Build Electron app package (Windows signed)
        if: runner.os == 'Windows'
        env:
          WIN_CERT_SHA1: ${{ secrets.WIN_CERT_SHA1 }}
          WIN_SIGNTOOL_PATH: ${{ vars.WIN_SIGNTOOL_PATH }}
          WIN_TIMESTAMP_URL: ${{ vars.WIN_TIMESTAMP_URL }}
        shell: powershell
        run: |
          if (-not $env:WIN_CERT_SHA1) {
            Write-Error "Missing WIN_CERT_SHA1 secret for Windows code signing."
            exit 1
          }
          pnpm exec electron-builder ${{ matrix.build_args }} --publish never

      - name: Verify Windows signatures
        if: runner.os == 'Windows'
        env:
          WIN_SIGNTOOL_PATH: ${{ vars.WIN_SIGNTOOL_PATH }}
        shell: powershell
        run: |
          $signTool = if ($env:WIN_SIGNTOOL_PATH) { $env:WIN_SIGNTOOL_PATH } else { 'C:\sign\signtool.exe' }
          if (-not (Test-Path $signTool)) {
            Write-Error "signtool not found at: $signTool"
            exit 1
          }
          $installer = Get-ChildItem -Path release -Filter 'IDBots Setup *.exe' | Select-Object -First 1
          if (-not $installer) {
            Write-Error "Windows installer not found in release directory."
            exit 1
          }
          & $signTool verify /pa /all $installer.FullName

      # Product-level guard: verify EVERY committed kernel patch is present in
      # what users actually install (extraResources lands verbatim in the
      # unpacked app). Fingerprints live in
      # scripts/dsh-kernel-patches/manifest.json — one entry per patch, and the
      # checker itself fails when a .patch has no entry, so a patch cannot ship
      # unverified (the v0.9.3 incident: a later install step wiped
      # node_modules, the two hand-written fingerprints then covered only two
      # of today's five patches, and the installer silently regressed).
      # Adding or rebasing a patch means updating that manifest.
      - name: Verify DSH kernel patches in the packaged app
        # No `shell:` override on purpose. This step used to be `shell: bash`
        # with a `case "$RUNNER_OS"` block, which dies on the self-hosted
        # Windows runner with `bash: command not found` (SOP §11.10: bash only
        # reaches PATH once MinGit is set up, and GitHub cannot spawn a shell
        # that is not there yet). `--packaged` resolves this OS's resources
        # root inside the script, so the step needs nothing beyond the runner's
        # default shell.
        run: node scripts/verify-dsh-kernel-patches.cjs --packaged

      - name: Notarize app (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_ARCH: ${{ matrix.mac_arch }}
        run: |
          APP_ZIP_PATH="$(node scripts/release-artifact-paths.cjs zip)"
          echo "Using APP_ZIP_PATH=$APP_ZIP_PATH"
          ditto -c -k --keepParent "release/${{ matrix.mac_dir }}/IDBots.app" "$APP_ZIP_PATH"
          xcrun notarytool submit "$APP_ZIP_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple "release/${{ matrix.mac_dir }}/IDBots.app"

      - name: Build DMG from prepackaged app (macOS)
        if: runner.os == 'macOS'
        env:
          IDBOTS_SKIP_NOTARIZE: 1
          PYTHON_PATH: /usr/bin/python3
        run: |
          PATH="$PWD/.tmp-bin:$PATH"
          mkdir -p .tmp-bin
          ln -sf /usr/bin/python3 .tmp-bin/python
          pnpm exec electron-builder --mac dmg --${{ matrix.mac_arch }} --prepackaged "release/${{ matrix.mac_dir }}/IDBots.app" --publish never

      - name: Codesign + notarize DMG (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAC_CODESIGN_IDENTITY: ${{ secrets.MAC_CODESIGN_IDENTITY }}
          CSC_KEYCHAIN: ${{ env.CSC_KEYCHAIN }}
          CSC_KEYCHAIN_PASSWORD: ${{ env.CSC_KEYCHAIN_PASSWORD }}
          APP_ARCH: ${{ matrix.mac_arch }}
        run: |
          if [ -z "$MAC_CODESIGN_IDENTITY" ]; then
            echo "MAC_CODESIGN_IDENTITY is required for DMG signing." >&2
            exit 1
          fi
          DMG_PATH="$(node scripts/release-artifact-paths.cjs dmg)"
          echo "Using DMG_PATH=$DMG_PATH"
          if [ -n "$CSC_KEYCHAIN" ] && [ -n "$CSC_KEYCHAIN_PASSWORD" ]; then
            security unlock-keychain -p "$CSC_KEYCHAIN_PASSWORD" "$CSC_KEYCHAIN"
            codesign --force --sign "$MAC_CODESIGN_IDENTITY" --keychain "$CSC_KEYCHAIN" "$DMG_PATH"
          else
            codesign --force --sign "$MAC_CODESIGN_IDENTITY" "$DMG_PATH"
          fi
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG_PATH"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Check out repository (for release scripts)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-macos-latest
          path: release-assets/macos

      # Intel (x64) DMG + its own manifest land in the same directory: the
      # macOS arm64 and x64 assets never collide by name (…-arm64.dmg vs
      # …-x64.dmg, latest-mac.yml vs latest-mac-x64.yml). Both jobs emit a
      # latest-mac.yml, but `finalize` rewrites it from the final signed DMG
      # afterwards, so whichever copy arrives last is not the shipped one.
      - name: Download macOS (Intel x64) artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-macos-15-intel
          path: release-assets/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-windows-signer
          path: release-assets/windows

      - name: Finalize update manifests from signed artifacts
        # electron-builder writes latest-mac.yml BEFORE the final DMG sign/staple,
        # so its size/sha512 never match the shipped DMG (SOP §8). Recompute all
        # manifests from the FINAL artifacts so the GitHub Release ships correct
        # hashes (latest-mac.yml = arm64, latest-mac-x64.yml = Intel) and OSS
        # gets the hyphen-name Windows manifest.
        run: |
          VERSION="${{ inputs.release_tag || github.ref_name }}"
          node scripts/release-finalize-yaml.cjs "${VERSION#v}"

      - name: Verify release assets
        run: |
          echo "Collected assets:"
          find release-assets -type f | sort

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: IDBots ${{ inputs.release_tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            Cross-platform desktop installers for IDBots.

            Included packages:
            - macOS DMG package, Apple Silicon (.dmg, signed & notarized)
            - macOS DMG package, Intel x64 (.dmg, signed & notarized)
            - Windows NSIS installer (.exe)

            Notes:
            - Both macOS DMGs are signed and notarized in GitHub Actions.
            - `latest-mac.yml` describes the Apple Silicon DMG; `latest-mac-x64.yml`
              describes the Intel DMG. The in-app updater reads
              https://idbots.ai/update.json instead.
          fail_on_unmatched_files: true
          files: |
            release-assets/macos/*.dmg
            release-assets/macos/*.blockmap
            release-assets/macos/latest-mac.yml
            release-assets/macos/latest-mac-x64.yml
            release-assets/windows/*.exe
            release-assets/windows/*.blockmap
            release-assets/windows/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish artifacts to OSS and warm CDN
        # Requires the four OSS_* secrets (already configured). Uploads both mac
        # DMGs (arm64 + x64), the space-free Windows installer name, and all
        # three manifests (latest-mac.yml, latest-mac-x64.yml, latest.yml) to OSS
        # with the correct per-object headers, then pre-warms the CDN and verifies it.
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
        run: |
          VERSION="${{ inputs.release_tag || github.ref_name }}"
          node scripts/release-publish-oss-cdn.cjs "${VERSION#v}"
