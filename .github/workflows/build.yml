name: Build/Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to publish from main (for example v0.6.2)"
        required: false
        type: string

permissions:
  contents: write  # 允许创建 GitHub Release 和上传 Release 附件

jobs:
  # A release pushes `main` and its `v*` tag together, which starts two runs for
  # the same commit one second apart. The main run is a strict subset of the tag
  # run, yet its Windows job queues for the single signing runner ahead of the
  # release — and cancelling it by hand is what takes the runner down (SOP
  # §11.16). On 2026-11-25 (v1.1.3) the tag run waited 57 min and 1 h 43 min
  # behind its own main runs, and a cancellation left the runner offline for
  # 7.5 h overnight. Decide up front whether a run is redundant, so that
  # nothing has to be cancelled later; scripts/ci-gate.mjs only skips what it
  # can prove.
  gate:
    runs-on: ubuntu-latest
    # Reading another run's jobs needs actions:read; naming any permission here
    # drops every other one, so contents is repeated.
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
      skip_tests: ${{ steps.gate.outputs.skip_tests }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          # Two commits: the gate diffs the pushed commit against its parent.
          fetch-depth: 2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # The gate is tested before anything relies on it: a broken gate must
      # stop the pipeline, never quietly skip it. The source restore tool is
      # tested here too, before the `source` job ships it to the signing
      # machine. Only the tests that need no node_modules run here; the full
      # set runs in each build job.
      - name: Test the gate and the tools that need no dependencies
        run: node --test tests/ciGate.test.mjs tests/ciReleaseWatch.test.mjs tests/ciWorktreeEol.test.mjs tests/ciWindowsSignOnce.test.mjs tests/ciSourceRestore.test.mjs tests/ciSourceCut.test.mjs

      # Two decisions: whether this run is redundant at all, and whether a tag
      # run may leave out its tests because the parent commit's main run
      # already ran the identical steps green on all three platforms.
      - name: Decide whether this run is redundant
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-gate.mjs

  # The signing machine's route to github.com:443 resets connections: its
  # checkout step failed on v0.9.6, v0.9.7, v0.9.8, v1.0.9, v1.1.0 and three
  # times on v1.1.3 (2026-11-25), where the forced re-clone alone took 107
  # minutes, and the release SOP had carried "prevention pending" since
  # 2026-09-28. It does reach GitHub's artifact storage — it already uploads
  # every build there — but downloading is slow: the first run with a full
  # bundle (2026-11-26) spent 15 minutes on 36 MB. So a hosted runner, with a
  # good route, takes the commit and hands it over twice, and the Windows job
  # tries the small one first (SOP §11.47).
  # (Owner decision 2026-11-26.)
  source:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          # Two commits: the first parent is the delta's fallback base.
          fetch-depth: 2
          # The token stays in this checkout so that the delta's base can be
          # fetched by commit (scripts/ci-source-cut.mjs). Nothing of it is
          # handed over: the pack and the bundle hold git objects only.

      - name: Bundle the commit together with the restore tool
        run: |
          mkdir -p "$RUNNER_TEMP/source-delta" "$RUNNER_TEMP/source-full"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          # The delta: what this commit reaches beyond the tip main had before
          # this push — the commit the signing machine holds — or beyond the
          # first parent where there is no such tip (a tag). A pack that
          # declares no prerequisites; measured at 50 KB to about 1 MB against
          # the full bundle's 36 MB. scripts/ci-source-cut.mjs says which base
          # it used.
          node scripts/ci-source-cut.mjs --out "$RUNNER_TEMP/source-delta/source.pack" --base "${{ github.event.before }}"
          # The full commit: cut from a shallow clone, the bundle holds this
          # commit and its whole tree.
          git bundle create "$RUNNER_TEMP/source-full/source.bundle" HEAD
          cp scripts/ci-source-restore.cjs "$RUNNER_TEMP/source-delta/"
          cp scripts/ci-source-restore.cjs "$RUNNER_TEMP/source-full/"
          ls -la "$RUNNER_TEMP/source-delta" "$RUNNER_TEMP/source-full"
      - name: Upload the source delta
        uses: actions/upload-artifact@v4
        with:
          name: source-delta
          path: ${{ runner.temp }}/source-delta
          retention-days: 1
          if-no-files-found: error

      - name: Upload the full source bundle
        uses: actions/upload-artifact@v4
        with:
          name: source-full
          path: ${{ runner.temp }}/source-full
          retention-days: 1
          if-no-files-found: error

  build:
    needs: [gate, source]
    if: needs.gate.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 (Apple Silicon).
          # mac_arch  -> the electron-builder arch flag and APP_ARCH for
          #             scripts/release-artifact-paths.cjs (the DMG file name).
          # mac_dir   -> electron-builder's --dir output directory. It is NOT
          #             derived from the arch: electron-builder treats x64 as
          #             the default arch, so x64 lands in `release/mac` while
          #             arm64 gets the `-arm64` suffix (`getArchSuffix` in
          #             builder-util returns "" for the default arch).
          - os: macos-latest
            build_args: --mac --arm64 --dir
            mac_arch: arm64
            mac_dir: mac-arm64
          # macOS x64 (Intel). Built on a native Intel hosted runner on purpose:
          # pnpm then resolves the darwin-x64 siblings of every optional native
          # package (dsh-runtime carries ~9 darwin-arm64 ones: cua-driver, sharp,
          # ripgrep, sherpa-onnx, koffi, ...). Cross-building --x64 from the arm64
          # runner would embed arm64 binaries into the Intel bundle.
          - os: macos-15-intel
            build_args: --mac --x64 --dir
            mac_arch: x64
            mac_dir: mac
          - os: windows-signer
            build_args: --win --x64
            mac_arch: ""
            mac_dir: ""

    steps:
      # Windows: 必须在 checkout 之前启用长路径，否则 git 操作可能被截断
      # It also keeps core.autocrlf off for every later git call in the job:
      # Git for Windows defaults it to true, which rewrites all ~4,300
      # LF-committed text files to CRLF — the whole "red on Windows only"
      # family (kernel patches v0.9.3, xiangqi fixture v0.9.5, METAAPPs and docs
      # commerce payloads v1.1.3), each so far patched one path at a time.
      - name: Enable Git long paths (Windows)
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false

      # The signing service is the one thing a Windows job cannot work around,
      # and it has given out at the far end of the job more than once: after
      # 54 minutes on 2026-11-27 (run 45937850363), after 708 signatures on
      # 2026-11-25. One real signature on a throwaway copy, before anything
      # else runs, turns that into a failure in the first minute, with the
      # cause named (release SOP §11.18).
      - name: Smoke-test the signing service (Windows)
        if: runner.os == 'Windows'
        env:
          WIN_CERT_SHA1: ${{ secrets.WIN_CERT_SHA1 }}
          WIN_SIGNTOOL_PATH: ${{ vars.WIN_SIGNTOOL_PATH }}
        shell: powershell
        run: |
          $signTool = if ($env:WIN_SIGNTOOL_PATH) { $env:WIN_SIGNTOOL_PATH } else { 'C:\sign\signtool.exe' }
          if (-not $env:WIN_CERT_SHA1) {
            Write-Error "Missing WIN_CERT_SHA1 secret for Windows code signing."
            exit 1
          }
          if (-not (Test-Path $signTool)) {
            Write-Error "signtool not found at: $signTool"
            exit 1
          }
          # A copy of signtool itself, in the job's temp directory: nothing of the machine's is signed or changed.
          $copy = Join-Path $env:RUNNER_TEMP ('sign-smoke-' + [guid]::NewGuid().ToString('N') + '.exe')
          $out = Join-Path $env:RUNNER_TEMP 'sign-smoke.out.txt'
          $err = Join-Path $env:RUNNER_TEMP 'sign-smoke.err.txt'
          Copy-Item -LiteralPath $signTool -Destination $copy
          # No timestamp: this asks only whether the private key can be used.
          # The arguments are those of the SOP's smoke signature, no more:
          # signtool's /n selects a certificate by subject name, it is not
          # "no prompt" — with it the search finds no certificate at all.
          $process = Start-Process -FilePath $signTool -ArgumentList @('sign', '/sha1', $env:WIN_CERT_SHA1, '/fd', 'SHA256', '/v', $copy) -NoNewWindow -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          # A handle taken before the process ends is what makes ExitCode readable afterwards in Windows PowerShell.
          $null = $process.Handle
          if (-not $process.WaitForExit(90000)) {
            try { $process.Kill() } catch {}
            $why = 'signtool did not answer within 90 seconds'
          } elseif ($process.ExitCode -ne 0) {
            $why = 'signtool exited with code ' + $process.ExitCode
          } else {
            $why = $null
          }
          $log = ''
          foreach ($file in @($out, $err)) {
            if (Test-Path -LiteralPath $file) { $log += ' ' + [System.IO.File]::ReadAllText($file) }
          }
          $log = ($log -replace '\s+', ' ').Trim()
          Remove-Item -LiteralPath $copy, $out, $err -Force -ErrorAction SilentlyContinue
          if ($log) { Write-Host $log }
          if ($why) {
            Write-Error ("The signing service is not usable: " + $why + ". Re-login SimplySign on the signing machine, do the smoke signature of release SOP 11.18, then rerun this job.")
            exit 1
          }
          Write-Host "The signing service signed a test file."

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Hosted runners reach github.com without trouble and check out directly.
      - name: Check out Git repository
        if: runner.os != 'Windows'
        uses: actions/checkout@v4
        with:
          # Shallow on purpose: nothing in a build job reads history or tags.
          # electron-builder only needs them when publishing, and every build
          # runs with --publish never (the version comes from package.json and
          # GITHUB_REF_NAME).
          fetch-depth: 1
          submodules: false

      # The signing machine never fetches from github.com (see the `source`
      # job). Its downloads from GitHub's artifact storage are slow at the
      # best of times, and on a bad evening they end early without a word: on
      # 2026-11-27 the delta and then the full bundle both arrived cut short,
      # and actions/download-artifact@v4 reported success for both — its last
      # two log lines were simply missing. So the step that downloads is not
      # trusted; the steps that use the files decide.
      #
      # scripts/ci-source-restore.cjs adds the delta's objects to the
      # repository the previous run left behind and, only once the whole tree
      # of the new commit is proven to be there, deletes every working file
      # and checks the commit out anew — so no file of an earlier run can
      # survive into this one (SOP §11.22, §11.43), and a refused delta leaves
      # the workspace as it was. The tool travels inside the artifact because
      # the workspace has no scripts in it at that point. Its exit code tells
      # three things apart: 3, the delta does not fit (the machine holds
      # another commit) and the full bundle takes over; 4, what arrived
      # cannot be read, and the delta is downloaded once more; anything else
      # is a real failure, which gets that same second chance once and then
      # hands over to the full bundle.
      - name: Download the source delta (Windows)
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: source-delta
          path: ${{ runner.temp }}/source-delta

      - name: Update the source tree from the delta (Windows)
        id: restore_delta
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          $restore = "$env:RUNNER_TEMP\source-delta\ci-source-restore.cjs"
          # A tag checkout stays detached, as actions/checkout leaves it; only a branch push gets a branch.
          if ($env:GITHUB_REF -like 'refs/heads/*') {
            node $restore --commit "$env:GITHUB_SHA" --branch "$env:GITHUB_REF_NAME"
          } else {
            node $restore --commit "$env:GITHUB_SHA"
          }
          $code = $LASTEXITCODE
          if ($code -eq 3) {
            [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "fitted=false`n")
            Write-Host "The source delta does not fit this workspace: the tree is rebuilt from the full bundle."
            exit 0
          }
          if ($code -ne 0) {
            # 4 is "what arrived cannot be read" — a download cut short, most likely. Any other failure gets the
            # same second chance, once. What was downloaded is removed first, so the next download starts clean.
            [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "fitted=damaged`n")
            Write-Host "The source delta could not be used (exit $code): it is downloaded once more."
            Remove-Item -LiteralPath "$env:RUNNER_TEMP\source-delta" -Recurse -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 15
            exit 0
          }
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "fitted=true`n")

      - name: Download the source delta again (Windows)
        if: runner.os == 'Windows' && steps.restore_delta.outputs.fitted == 'damaged'
        uses: actions/download-artifact@v4
        with:
          name: source-delta
          path: ${{ runner.temp }}/source-delta

      - name: Update the source tree from the delta again (Windows)
        id: restore_delta_retry
        if: runner.os == 'Windows' && steps.restore_delta.outputs.fitted == 'damaged'
        continue-on-error: true
        run: |
          $restore = "$env:RUNNER_TEMP\source-delta\ci-source-restore.cjs"
          # A tag checkout stays detached, as actions/checkout leaves it; only a branch push gets a branch.
          if ($env:GITHUB_REF -like 'refs/heads/*') {
            node $restore --commit "$env:GITHUB_SHA" --branch "$env:GITHUB_REF_NAME"
          } else {
            node $restore --commit "$env:GITHUB_SHA"
          }
          $code = $LASTEXITCODE
          if ($code -eq 3) {
            [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "fitted=false`n")
            Write-Host "The source delta does not fit this workspace: the tree is rebuilt from the full bundle."
            exit 0
          }
          if ($code -ne 0) {
            # 4 is "what arrived cannot be read" — a download cut short, most likely. Any other failure gets the
            # same second chance, once. What was downloaded is removed first, so the next download starts clean.
            [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "fitted=damaged`n")
            Write-Host "The source delta could not be used (exit $code): it is downloaded once more."
            Remove-Item -LiteralPath "$env:RUNNER_TEMP\source-delta" -Recurse -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 15
            exit 0
          }
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "fitted=true`n")


      # The full bundle: only when the delta did not work out, second chance included.
      - name: Download the full source bundle (Windows)
        if: runner.os == 'Windows' && steps.restore_delta.outputs.fitted != 'true' && steps.restore_delta_retry.outputs.fitted != 'true'
        uses: actions/download-artifact@v4
        with:
          name: source-full
          path: ${{ runner.temp }}/source-full

      - name: Rebuild the source tree from the full bundle (Windows)
        id: rebuild_full
        if: runner.os == 'Windows' && steps.restore_delta.outputs.fitted != 'true' && steps.restore_delta_retry.outputs.fitted != 'true'
        continue-on-error: true
        run: |
          $restore = "$env:RUNNER_TEMP\source-full\ci-source-restore.cjs"
          if ($env:GITHUB_REF -like 'refs/heads/*') {
            node $restore --fresh --commit "$env:GITHUB_SHA" --branch "$env:GITHUB_REF_NAME"
          } else {
            node $restore --fresh --commit "$env:GITHUB_SHA"
          }
          if ($LASTEXITCODE -ne 0) {
            # Most likely the bundle arrived cut short. It is removed so that the next download starts clean.
            Remove-Item -LiteralPath "$env:RUNNER_TEMP\source-full" -Recurse -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 15
            exit $LASTEXITCODE
          }

      - name: Download the full source bundle again (Windows)
        if: runner.os == 'Windows' && steps.rebuild_full.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: source-full
          path: ${{ runner.temp }}/source-full

      # No second chance left: this one ends the job if the bundle is still unusable.
      - name: Rebuild the source tree from the full bundle again (Windows)
        if: runner.os == 'Windows' && steps.rebuild_full.outcome == 'failure'
        run: |
          $restore = "$env:RUNNER_TEMP\source-full\ci-source-restore.cjs"
          if ($env:GITHUB_REF -like 'refs/heads/*') {
            node $restore --fresh --commit "$env:GITHUB_SHA" --branch "$env:GITHUB_REF_NAME"
          } else {
            node $restore --fresh --commit "$env:GITHUB_SHA"
          }
          if ($LASTEXITCODE -ne 0) {
            # Most likely the bundle arrived cut short. It is removed so that the next download starts clean.
            Remove-Item -LiteralPath "$env:RUNNER_TEMP\source-full" -Recurse -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 15
            exit $LASTEXITCODE
          }


      - name: Enable pnpm
        run: corepack enable

      - name: Get pnpm store directory (non-Windows)
        if: runner.os != 'Windows'
        id: pnpm-store-nix
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      # Hosted runners only. The self-hosted win-sign runner keeps its pnpm
      # store on disk between runs; archiving and uploading that multi-GB store
      # over the signing machine's throttled link took 24 min in the post step
      # of every successful job (runs 44735013693, 45589655519) and up to 10 min
      # to restore — all while the single runner stays busy and queued jobs
      # wait. (Do not give an early Windows step `shell: bash`: bash only
      # reaches PATH with "Setup MinGit (Windows)" further down, SOP §11.10.)
      - uses: actions/cache@v4
        if: runner.os != 'Windows'
        with:
          path: ${{ steps.pnpm-store-nix.outputs.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'dsh-runtime/pnpm-lock.yaml', 'SKILLs/web-search/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Verify tag matches package version (non-Windows)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os != 'Windows'
        run: |
          node -e 'const tag=process.env.GITHUB_REF_NAME||""; const version=require("./package.json").version; const expected="v"+version; if(tag!==expected){console.error("Tag/package version mismatch: tag="+tag+" package="+version+" expected="+expected); process.exit(1);} console.log("Tag/package version aligned: "+tag);'

      - name: Verify tag matches package version (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        shell: powershell
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "" }
          $packageJson = Get-Content -Raw -Path "package.json" | ConvertFrom-Json
          $version = $packageJson.version
          $expected = "v$version"
          if ($tag -ne $expected) {
            Write-Error ("Tag/package version mismatch: tag={0} package={1} expected={2}" -f $tag, $version, $expected)
            exit 1
          }
          Write-Host ("Tag/package version aligned: {0}" -f $tag)

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install DSH runtime dependencies
        working-directory: dsh-runtime
        run: pnpm install --frozen-lockfile

      # Any reinstall of dsh-runtime/node_modules can wipe the kernel patches
      # the root postinstall applied. Re-apply AFTER the last dsh-runtime
      # install step: without this the packaged app silently ships the
      # unpatched kernel (v0.9.3 regression — the shipped Windows exe still
      # flashed a bash.exe console window while CI stayed green).
      - name: Apply DSH kernel patches
        run: node scripts/apply-dsh-kernel-patches.cjs

      - name: Build renderer (Vite)
        run: pnpm run build

      - name: Compile Electron main process
        run: pnpm run compile:electron

      # This workflow's own tooling on a real checkout of this platform: the
      # gate, the byte-exact checkout, the incremental compile, the sign-once
      # hook and the workflow's wiring (scripts/ci-*.mjs).
      - name: Guard the CI tooling itself
        id: test_ci_tooling
        if: needs.gate.outputs.skip_tests != 'true'
        continue-on-error: true
        run: pnpm run test:ci-tooling

      - name: Run Windows installer reliability tests
        id: test_windows_installer_reliability
        if: needs.gate.outputs.skip_tests != 'true'
        continue-on-error: true
        run: node --test tests/windowsInstallerReliability.test.mjs

      # Grammar gate for scripts/nsis-installer.nsh: the regex test above
      # pins source shapes but cannot see NSIS grammar (unknown $vars expand
      # silently, labels only fail at compile). Compile the syntax harness
      # under -WX, both shapes, BEFORE packaging so a makensis-level break
      # surfaces here instead of inside the first real signing run. NSIS is
      # installed on demand: the electron-builder cache is empty on a cold
      # runner.
      - name: Compile the NSIS syntax harness (makensis -WX)
        id: test_nsis_harness
        continue-on-error: true
        if: runner.os == 'Windows' && needs.gate.outputs.skip_tests != 'true'
        shell: powershell
        run: |
          # Mirror findMakensis in scripts/verify-nsis-harness.mjs: iterate
          # EVERY cache dir for makensis.exe. The electron-builder cache root
          # mixes the NSIS core (nsis-<ver>) with the nsis-resources package,
          # and "nsis-resources-*" sorts above "nsis-<ver>" in descending name
          # order — picking only the newest-NAMED dir false-negatives the
          # cache on win-sign (only the 2017 nsis-3.0.4.1 core that
          # electron-builder 24 pins is present) and died on the choco
          # fallback this self-hosted runner does not have (2026-11-19).
          $cacheMakensis = Get-ChildItem "$env:LOCALAPPDATA\electron-builder\Cache\nsis" -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName 'makensis.exe' } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue) -and -not $cacheMakensis) {
            choco install nsis -y --no-progress
          }
          node scripts/verify-nsis-harness.mjs --require-makensis

      - name: Run LLM-safe text tests
        id: test_llm_safe_text
        if: needs.gate.outputs.skip_tests != 'true'
        continue-on-error: true
        run: node --test tests/llmSafeText.test.mjs

      # The long-term task suite guards the first-class board (redesign):
      # the entity store lifecycle, the heartbeat dispatcher, and the
      # longterm.advance escalation rules.
      - name: Run long-term task tests
        id: test_long_term_task
        if: needs.gate.outputs.skip_tests != 'true'
        continue-on-error: true
        run: node --test tests/longTermTaskStore.test.mjs tests/heartbeatService.test.mjs tests/longTermAdvanceService.test.mjs tests/longTermTaskAgentTools.test.mjs

      # Agent-Game-v2 runtime: seat.claimed identity writes, membership
      # bootstrap before the first on-chain write (room 924-2 root cause),
      # local-bot auto-approve fast lane + the RPC bot channel.
      - name: Run agent-game tests
        id: test_agent_game
        if: needs.gate.outputs.skip_tests != 'true'
        continue-on-error: true
        run: pnpm run test:agent-game

      - name: Validate runtime dependency contracts
        id: test_runtime_dependency_contracts
        if: needs.gate.outputs.skip_tests != 'true'
        continue-on-error: true
        run: |
          node --test tests/runtimeDependencyContract.test.mjs tests/dshRuntimeDepsCheck.test.mjs
          # Depth defense: prove the kernel patches survived every install
          # step above (they live in gitignored node_modules, so nothing else
          # would catch a step that reinstalls dsh-runtime after the apply).
          node scripts/apply-dsh-kernel-patches.cjs --check

      # Behavioral depth defense for the ask_user_question kernel patch:
      # --check proves the bytes applied, this proves the patched tool still
      # forwards per-question detail context across the runtime → host bridge
      # (ask-bridge E2E, mock provider, no network), and the static test pins
      # the patch + prompt contract in source.
      - name: Run dsh ask-context tests
        id: test_dsh_ask_context
        if: needs.gate.outputs.skip_tests != 'true'
        continue-on-error: true
        run: |
          node dsh-runtime/test/ask-bridge.test.mjs
          node --test tests/coworkAskContextPrompt.test.mjs

      # Static source-contract tests for the workspace-instructions line
      # (AGENTS.md/CLAUDE.md injection + git branch chip). Pure file-read +
      # regex assertions: no compile step needed, safe on every matrix OS.
      - name: Run workspace-instructions contract tests
        id: test_workspace_instructions
        if: needs.gate.outputs.skip_tests != 'true'
        continue-on-error: true
        run: node --test tests/workspaceInstructionsBoundary.test.mjs tests/coworkSessionDetailGitBranch.test.mjs

      # Static source-contract tests for the pinned-skill backstop and the
      # bot-internet composer reuse (pure file-read assertions, no compile).
      - name: Run pinned-skill contract tests
        id: test_pinned_skills
        if: needs.gate.outputs.skip_tests != 'true'
        continue-on-error: true
        run: pnpm run test:pinned-skills

      # Behavioral regression suites for the review-round fixes: group-task
      # daemon/staffing/entropy, per-bot skill assignment, cowork proxy.
      # Each script runs compile:electron first (project convention).
      - name: Run group-task / skill-assignment / cowork-proxy regression tests
        id: test_release_regressions
        if: needs.gate.outputs.skip_tests != 'true'
        continue-on-error: true
        run: pnpm run test:release-regressions

      # Umbrella for the release-review test wiring (2026-11-10): 32 new test
      # files from the v1.0.10..HEAD cycle existed on disk but were referenced
      # by no chain, so CI never executed them. The script runs
      # compile:electron first (14 of its node suites require dist-electron).
      - name: Run release-review umbrella tests
        id: test_release_review
        if: needs.gate.outputs.skip_tests != 'true'
        continue-on-error: true
        run: pnpm run test:release-review

      # H-64 leg B: a wake re-drive must be identifiable at the presentation
      # layer — the re-presented row carries the re-served bit plus the
      # original message id, never retroactively, with the wake scheduling
      # semantics unchanged. Pins the disposition contract and the
      # [NO_REPLY] -> wake -> fired -> re-drive flow (the script runs
      # compile:electron first, project convention).
      - name: Run private-chat wake re-drive disposition tests
        id: test_private_chat_wake
        if: needs.gate.outputs.skip_tests != 'true'
        continue-on-error: true
        run: pnpm run test:private-chat-wake-disposition

      # Behavioral regression for the daily-report / follow-up gate: the
      # collector, generator, settings, cerebellum triage, session follow-up
      # gate, and the cowork follow-up flow. The script runs
      # compile:electron first (project convention).
      - name: Run daily-report / follow-up regression tests
        id: test_daily_report
        if: needs.gate.outputs.skip_tests != 'true'
        continue-on-error: true
        run: pnpm run test:daily-report

      - name: Run memory and team-culture tests
        id: test_memory
        if: needs.gate.outputs.skip_tests != 'true'
        continue-on-error: true
        run: pnpm run test:memory

      # Behavioral regression for the OpenTeam task-close fix (H-79): the
      # task-close pin list is capped so team impressions are never silently
      # dropped. Runs compile:electron first (project convention).
      - name: Run open-team impression tests
        id: test_open_team_impression
        if: needs.gate.outputs.skip_tests != 'true'
        continue-on-error: true
        run: pnpm run test:open-team-impression

      - name: Run dream retry classification tests
        id: test_dream_retry
        if: needs.gate.outputs.skip_tests != 'true'
        continue-on-error: true
        run: pnpm run test:dream-retry

      - name: Run MetaWeb agent-tool tests
        id: test_metaweb
        if: needs.gate.outputs.skip_tests != 'true'
        continue-on-error: true
        run: pnpm run test:metaweb

      # Behavioral regression for the omni_read shaping cap (H-71) and for the
      # over-budget LIST-page contract built on top of it: a truncated read must
      # declare first-N-of-M plus a resume cursor instead of spilling silently,
      # and a list page that still fits whole rows must come back as parseable
      # JSON carrying only whole rows. test:omni-read runs both suites
      # (omniReaderAgentTools + omniReadListTruncation); compile:electron runs
      # first (project convention).
      - name: Run omni-read agent-tool and list-page contract tests
        id: test_omni_read
        if: needs.gate.outputs.skip_tests != 'true'
        continue-on-error: true
        run: pnpm run test:omni-read

      # Behavioral regression for the gateway-wide JSON object body guard:
      # every POST route must answer a bad body with 400 + contract +
      # error_code instead of hanging the caller or leaking an internal
      # TypeError. Starts the real compiled gateway on a random port; the
      # script runs compile:electron first (project convention).
      - name: Run MetaID RPC body-guard tests
        id: test_rpc_body_guard
        if: needs.gate.outputs.skip_tests != 'true'
        continue-on-error: true
        run: pnpm run test:rpc-body-guard

      # On-chain commerce, FT/NFT escrow & atomic-swap, Token/FT/NFT card suites,
      # and PayBuzz dual-track unlock verification gates.
      - name: Run commerce, goods-trade, FT-commerce, PayBuzz, and wallet-security tests
        id: test_commerce_wallet
        if: needs.gate.outputs.skip_tests != 'true'
        continue-on-error: true
        run: |
          pnpm run test:commerce
          pnpm run test:goods-trade
          pnpm run test:ft-commerce
          pnpm run test:paybuzz
          pnpm run test:wallet-security

      # One verdict for every test step above. They run with
      # continue-on-error so one red suite no longer hides the next: v1.1.3
      # peeled the commerce block across two 50+ minute rounds (CRLF, then a
      # Windows-path bug behind it) and three more rounds died at agent-game
      # without ever reaching the suites after it. Every suite runs; this step
      # fails the job if any did — before any packaging starts.
      - name: Fail the job if any test step failed (aggregated verdict)
        env:
          TEST_CI_TOOLING_OUTCOME: ${{ steps.test_ci_tooling.outcome }}
          TEST_WINDOWS_INSTALLER_RELIABILITY_OUTCOME: ${{ steps.test_windows_installer_reliability.outcome }}
          TEST_NSIS_HARNESS_OUTCOME: ${{ steps.test_nsis_harness.outcome }}
          TEST_LLM_SAFE_TEXT_OUTCOME: ${{ steps.test_llm_safe_text.outcome }}
          TEST_LONG_TERM_TASK_OUTCOME: ${{ steps.test_long_term_task.outcome }}
          TEST_AGENT_GAME_OUTCOME: ${{ steps.test_agent_game.outcome }}
          TEST_RUNTIME_DEPENDENCY_CONTRACTS_OUTCOME: ${{ steps.test_runtime_dependency_contracts.outcome }}
          TEST_DSH_ASK_CONTEXT_OUTCOME: ${{ steps.test_dsh_ask_context.outcome }}
          TEST_WORKSPACE_INSTRUCTIONS_OUTCOME: ${{ steps.test_workspace_instructions.outcome }}
          TEST_PINNED_SKILLS_OUTCOME: ${{ steps.test_pinned_skills.outcome }}
          TEST_RELEASE_REGRESSIONS_OUTCOME: ${{ steps.test_release_regressions.outcome }}
          TEST_RELEASE_REVIEW_OUTCOME: ${{ steps.test_release_review.outcome }}
          TEST_PRIVATE_CHAT_WAKE_OUTCOME: ${{ steps.test_private_chat_wake.outcome }}
          TEST_DAILY_REPORT_OUTCOME: ${{ steps.test_daily_report.outcome }}
          TEST_MEMORY_OUTCOME: ${{ steps.test_memory.outcome }}
          TEST_OPEN_TEAM_IMPRESSION_OUTCOME: ${{ steps.test_open_team_impression.outcome }}
          TEST_DREAM_RETRY_OUTCOME: ${{ steps.test_dream_retry.outcome }}
          TEST_METAWEB_OUTCOME: ${{ steps.test_metaweb.outcome }}
          TEST_OMNI_READ_OUTCOME: ${{ steps.test_omni_read.outcome }}
          TEST_RPC_BODY_GUARD_OUTCOME: ${{ steps.test_rpc_body_guard.outcome }}
          TEST_COMMERCE_WALLET_OUTCOME: ${{ steps.test_commerce_wallet.outcome }}
        run: node scripts/ci-test-verdict.mjs

      - name: Install web-search skill dependencies
        working-directory: SKILLs/web-search
        run: pnpm install --frozen-lockfile

      - name: Build web-search skill
        run: pnpm run build:skill:web-search

      # Windows: 下载捆绑的 PortableGit
      - name: Setup MinGit (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $archiveDir = 'C:\actions-runner\_cache'
          $archivePath = Join-Path $archiveDir 'PortableGit-2.47.1-64-bit.7z.exe'
          $downloadUrl = 'https://github.com/git-for-windows/git/releases/download/v2.47.1.windows.1/PortableGit-2.47.1-64-bit.7z.exe'

          New-Item -Path $archiveDir -ItemType Directory -Force | Out-Null
          $archiveValid = (Test-Path $archivePath) -and ((Get-Item $archivePath).Length -ge 1048576)

          if (-not $archiveValid) {
            Write-Host "PortableGit cache miss. Downloading: $downloadUrl"
            $downloaded = $false
            foreach ($attempt in 1..5) {
              try {
                Invoke-WebRequest -Uri $downloadUrl -OutFile $archivePath -UseBasicParsing -TimeoutSec 300
                if ((Get-Item $archivePath).Length -ge 1048576) {
                  $downloaded = $true
                  break
                }
              } catch {
                Write-Warning ("PortableGit download attempt {0} failed: {1}" -f $attempt, $_.Exception.Message)
              }
              Start-Sleep -Seconds (5 * $attempt)
            }
            if (-not $downloaded) {
              throw "Failed to obtain PortableGit archive for Windows packaging."
            }
          }

          $env:IDBOTS_PORTABLE_GIT_ARCHIVE = $archivePath
          # Exported for scripts/mingit-signed-cache.cjs, which keys the signed PortableGit cache on the archive.
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "IDBOTS_PORTABLE_GIT_ARCHIVE=$archivePath`n")
          node scripts/setup-mingit.js --required

      # PortableGit is a fixed third-party tree — 333 of the 356 binaries the
      # Windows job signs — so its signed form is the same from build to build.
      # Reuse the copy signed once for this archive and certificate instead of
      # sending those signatures through the cloud signer and the timestamp
      # servers on every build (the v1.1.3 tag run 45609195621 lost its signer
      # on the 711th signature of the build and failed eight 90-second timeouts
      # later). A miss falls back to normal signing: an empty or damaged cache
      # cannot break a build.
      - name: Reuse the signed PortableGit cache (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          WIN_CERT_SHA1: ${{ secrets.WIN_CERT_SHA1 }}
        run: |
          # AppendAllText writes UTF-8 without a BOM (Out-File/Add-Content differ per PS version).
          $presigned = Join-Path $env:RUNNER_TEMP 'idbots-presigned-mingit.json'
          if (Test-Path $presigned) { Remove-Item $presigned -Force }
          # GITHUB_ENV reaches the steps after this one, not this one: the process that
          # writes the digest list needs the variable here as well. Without this line
          # the list went to the account's temp directory, the signing hook of the next
          # step looked under RUNNER_TEMP, found nothing, and signed all 343 PortableGit
          # executables again on the first cache hit (run 46037790077, 2026-11-28).
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "IDBOTS_PRESIGNED_MANIFEST=$presigned`n")
          $env:IDBOTS_PRESIGNED_MANIFEST = $presigned
          node scripts/mingit-signed-cache.cjs apply

      # 非 Windows: 创建 mingit 占位目录，避免 electron-builder 报"file source doesn't exist"错误
      - name: Create mingit placeholder (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: mkdir -p resources/mingit

      # ffmpeg is gitignored; electron-builder only warns and skips a missing extraResource.
      - name: Setup bundled ffmpeg
        run: node scripts/setup-ffmpeg.js --required

      # 根据平台启用签名配置（避免 Windows 缺少 bash）
      - name: Configure code signing (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          SECRET_CSC_LINK: ${{ secrets.CSC_LINK }}
          SECRET_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -n "${SECRET_CSC_LINK}" ] && [ -n "${SECRET_CSC_KEY_PASSWORD}" ]; then
            echo "macOS signing certificate is configured. It will be imported into the workflow keychain in the next step."
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi

      - name: Configure code signing (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          SECRET_WIN_CERT_SHA1: ${{ secrets.WIN_CERT_SHA1 }}
        run: |
          if ($env:SECRET_WIN_CERT_SHA1) {
            "CSC_IDENTITY_AUTO_DISCOVERY=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            "CSC_IDENTITY_AUTO_DISCOVERY=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Prepare macOS signing keychain
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo "CSC_LINK/CSC_KEY_PASSWORD not configured for macOS signing." >&2
            exit 1
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/idbots.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT_PATH="$RUNNER_TEMP/idbots-signing.p12"
          printf '%s' "$CSC_LINK" | base64 --decode > "$CERT_PATH" 2>/dev/null || printf '%s' "$CSC_LINK" | base64 -D > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"
          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "CSC_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Build Electron app package (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IDBOTS_SKIP_NOTARIZE: 1
        run: >
          pnpm exec electron-builder ${{ matrix.build_args }}
          --publish never

      - name: Build Electron app package (Windows signed)
        if: runner.os == 'Windows'
        env:
          WIN_CERT_SHA1: ${{ secrets.WIN_CERT_SHA1 }}
          WIN_SIGNTOOL_PATH: ${{ vars.WIN_SIGNTOOL_PATH }}
          WIN_TIMESTAMP_URL: ${{ vars.WIN_TIMESTAMP_URL }}
        shell: powershell
        run: |
          if (-not $env:WIN_CERT_SHA1) {
            Write-Error "Missing WIN_CERT_SHA1 secret for Windows code signing."
            exit 1
          }
          pnpm exec electron-builder ${{ matrix.build_args }} --publish never

      # Fill the PortableGit cache from this build's signed tree. Best effort:
      # the next build's cache hit is an optimization, never a requirement.
      - name: Store the signed PortableGit cache (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        env:
          WIN_CERT_SHA1: ${{ secrets.WIN_CERT_SHA1 }}
        run: node scripts/mingit-signed-cache.cjs store

      - name: Verify Windows signatures
        if: runner.os == 'Windows'
        env:
          WIN_SIGNTOOL_PATH: ${{ vars.WIN_SIGNTOOL_PATH }}
        shell: powershell
        run: |
          $signTool = if ($env:WIN_SIGNTOOL_PATH) { $env:WIN_SIGNTOOL_PATH } else { 'C:\sign\signtool.exe' }
          if (-not (Test-Path $signTool)) {
            Write-Error "signtool not found at: $signTool"
            exit 1
          }
          $installer = Get-ChildItem -Path release -Filter 'IDBots Setup *.exe' | Select-Object -First 1
          if (-not $installer) {
            Write-Error "Windows installer not found in release directory."
            exit 1
          }
          & $signTool verify /pa /all $installer.FullName

      # Product-level guard: verify EVERY committed kernel patch is present in
      # what users actually install (extraResources lands verbatim in the
      # unpacked app). Fingerprints live in
      # scripts/dsh-kernel-patches/manifest.json — one entry per patch, and the
      # checker itself fails when a .patch has no entry, so a patch cannot ship
      # unverified (the v0.9.3 incident: a later install step wiped
      # node_modules, the two hand-written fingerprints then covered only two
      # of today's five patches, and the installer silently regressed).
      # Adding or rebasing a patch means updating that manifest.
      - name: Verify DSH kernel patches in the packaged app
        # No `shell:` override on purpose. This step used to be `shell: bash`
        # with a `case "$RUNNER_OS"` block, which dies on the self-hosted
        # Windows runner with `bash: command not found` (SOP §11.10: bash only
        # reaches PATH once MinGit is set up, and GitHub cannot spawn a shell
        # that is not there yet). `--packaged` resolves this OS's resources
        # root inside the script, so the step needs nothing beyond the runner's
        # default shell.
        run: node scripts/verify-dsh-kernel-patches.cjs --packaged

      - name: Verify the packaged app reports the release version (macOS)
        # Clients compare their own bundle version against the update manifest,
        # so an artifact that reports a different version makes every
        # installation re-download the same package forever. On 2026-10-19 the
        # v1.0.1 installer shipped an internal 1.0.0 while the tag, the file
        # name and the manifest all said 1.0.1, and nothing in the pipeline
        # looked at the artifact itself.
        if: runner.os == 'macOS'
        run: node scripts/verify-release-artifact-version.cjs "release/${{ matrix.mac_dir }}/IDBots.app"

      - name: Notarize app (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_ARCH: ${{ matrix.mac_arch }}
        run: |
          APP_ZIP_PATH="$(node scripts/release-artifact-paths.cjs zip)"
          echo "Using APP_ZIP_PATH=$APP_ZIP_PATH"
          ditto -c -k --keepParent "release/${{ matrix.mac_dir }}/IDBots.app" "$APP_ZIP_PATH"
          # notarytool submit and stapler staple both hit Apple services that
          # intermittently drop connections on some hosted runner pools
          # (NSURLError -1005 to api.apple-cloudkit.com). Retry both.
          submit_ok=0
          for submit_attempt in 1 2 3; do
            if xcrun notarytool submit "$APP_ZIP_PATH" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --wait; then
              submit_ok=1
              break
            fi
            if [ "$submit_attempt" = 3 ]; then
              echo "notarytool submit failed after 3 attempts" >&2
              exit 1
            fi
            echo "notarytool attempt $submit_attempt failed; retrying in 60s"
            sleep 60
          done
          test "$submit_ok" = 1
          staple_ok=0
          for staple_attempt in 1 2 3 4 5; do
            if xcrun stapler staple "release/${{ matrix.mac_dir }}/IDBots.app"; then
              staple_ok=1
              break
            fi
            if [ "$staple_attempt" = 5 ]; then
              echo "stapler failed after 5 attempts" >&2
              exit 1
            fi
            echo "stapler attempt $staple_attempt failed (transient Apple network flake); retrying in 30s"
            sleep 30
          done
          test "$staple_ok" = 1

      - name: Build DMG from prepackaged app (macOS)
        if: runner.os == 'macOS'
        env:
          IDBOTS_SKIP_NOTARIZE: 1
          PYTHON_PATH: /usr/bin/python3
        run: |
          PATH="$PWD/.tmp-bin:$PATH"
          mkdir -p .tmp-bin
          ln -sf /usr/bin/python3 .tmp-bin/python
          pnpm exec electron-builder --mac dmg --${{ matrix.mac_arch }} --prepackaged "release/${{ matrix.mac_dir }}/IDBots.app" --publish never

      - name: Codesign + notarize DMG (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAC_CODESIGN_IDENTITY: ${{ secrets.MAC_CODESIGN_IDENTITY }}
          CSC_KEYCHAIN: ${{ env.CSC_KEYCHAIN }}
          CSC_KEYCHAIN_PASSWORD: ${{ env.CSC_KEYCHAIN_PASSWORD }}
          APP_ARCH: ${{ matrix.mac_arch }}
        run: |
          if [ -z "$MAC_CODESIGN_IDENTITY" ]; then
            echo "MAC_CODESIGN_IDENTITY is required for DMG signing." >&2
            exit 1
          fi
          DMG_PATH="$(node scripts/release-artifact-paths.cjs dmg)"
          echo "Using DMG_PATH=$DMG_PATH"
          if [ -n "$CSC_KEYCHAIN" ] && [ -n "$CSC_KEYCHAIN_PASSWORD" ]; then
            security unlock-keychain -p "$CSC_KEYCHAIN_PASSWORD" "$CSC_KEYCHAIN"
            codesign --force --sign "$MAC_CODESIGN_IDENTITY" --keychain "$CSC_KEYCHAIN" "$DMG_PATH"
          else
            codesign --force --sign "$MAC_CODESIGN_IDENTITY" "$DMG_PATH"
          fi
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          # stapler validate does a CloudKit ticket-delivery lookup that
          # intermittently dies with NSURLError -1005 on some hosted runner
          # pools (v1.0.10 prep: 3/3 failures on macos-15-intel while
          # macos-latest passed). Retry before giving up — stapling is
          # idempotent, so a re-run over a half-stapled DMG is safe.
          staple_ok=0
          for staple_attempt in 1 2 3 4 5; do
            if xcrun stapler staple "$DMG_PATH"; then
              staple_ok=1
              break
            fi
            if [ "$staple_attempt" = 5 ]; then
              echo "stapler failed after 5 attempts" >&2
              exit 1
            fi
            echo "stapler attempt $staple_attempt failed (transient Apple network flake); retrying in 30s"
            sleep 30
          done
          test "$staple_ok" = 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Check out repository (for release scripts)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-macos-latest
          path: release-assets/macos

      # Intel (x64) DMG + its own manifest land in the same directory: the
      # macOS arm64 and x64 assets never collide by name (…-arm64.dmg vs
      # …-x64.dmg, latest-mac.yml vs latest-mac-x64.yml). Both jobs emit a
      # latest-mac.yml, but `finalize` rewrites it from the final signed DMG
      # afterwards, so whichever copy arrives last is not the shipped one.
      - name: Download macOS (Intel x64) artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-macos-15-intel
          path: release-assets/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-windows-signer
          path: release-assets/windows

      - name: Finalize update manifests from signed artifacts
        # electron-builder writes latest-mac.yml BEFORE the final DMG sign/staple,
        # so its size/sha512 never match the shipped DMG (SOP §8). Recompute all
        # manifests from the FINAL artifacts so the GitHub Release ships correct
        # hashes (latest-mac.yml = arm64, latest-mac-x64.yml = Intel) and OSS
        # gets the hyphen-name Windows manifest.
        run: |
          VERSION="${{ inputs.release_tag || github.ref_name }}"
          node scripts/release-finalize-yaml.cjs "${VERSION#v}"

      - name: Verify release assets
        run: |
          echo "Collected assets:"
          find release-assets -type f | sort

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: IDBots ${{ inputs.release_tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            Cross-platform desktop installers for IDBots.

            Included packages:
            - macOS DMG package, Apple Silicon (.dmg, signed & notarized)
            - macOS DMG package, Intel x64 (.dmg, signed & notarized)
            - Windows NSIS installer (.exe)

            Notes:
            - Both macOS DMGs are signed and notarized in GitHub Actions.
            - `latest-mac.yml` describes the Apple Silicon DMG; `latest-mac-x64.yml`
              describes the Intel DMG. The in-app updater reads
              https://idbots.ai/update.json instead.
          fail_on_unmatched_files: true
          files: |
            release-assets/macos/*.dmg
            release-assets/macos/*.blockmap
            release-assets/macos/latest-mac.yml
            release-assets/macos/latest-mac-x64.yml
            release-assets/windows/*.exe
            release-assets/windows/*.blockmap
            release-assets/windows/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish artifacts to OSS and warm CDN
        # Requires the four OSS_* secrets (already configured). Uploads both mac
        # DMGs (arm64 + x64), the space-free Windows installer name, and all
        # three manifests (latest-mac.yml, latest-mac-x64.yml, latest.yml) to OSS
        # with the correct per-object headers, then pre-warms the CDN and verifies it.
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
        run: |
          VERSION="${{ inputs.release_tag || github.ref_name }}"
          node scripts/release-publish-oss-cdn.cjs "${VERSION#v}"
